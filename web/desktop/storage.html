<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content='width=device-width, initial-scale=1'>
<title>Storage Manager · ForgeNAS</title>
<style>
    :root {
      --bg: #eef3f8;
      --surface: #ffffff;
      --surface-2: #f7faff;
      --surface-3: #edf4ff;
      --text: #152238;
      --muted: #68758b;
      --line: rgba(21,34,56,.10);
      --primary: #2962ff;
      --primary-2: #00a4b8;
      --primary-soft: rgba(41,98,255,.12);
      --success: #10a66a;
      --warn: #d88a00;
      --danger: #cf3d46;
      --shadow: 0 18px 55px rgba(19,35,58,.12);
      --shadow-soft: 0 10px 30px rgba(19,35,58,.08);
      --radius: 24px;
      --radius-sm: 16px;
      --sidebar: 292px;
      --topbar: 76px;
      --font: Inter, Roboto, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(circle at 15% 8%, rgba(41,98,255,.18), transparent 28%),
        radial-gradient(circle at 92% 12%, rgba(0,164,184,.16), transparent 30%),
        linear-gradient(135deg, #f8fbff 0%, var(--bg) 45%, #e8f1fb 100%);
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 18px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(24px);
      box-shadow: 8px 0 36px rgba(19,35,58,.06);
      z-index: 4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px 22px;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      box-shadow: 0 16px 30px rgba(41,98,255,.28);
    }

    svg { width: 22px; height: 22px; display: block; }
    .brand h1 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .nav-title {
      margin: 18px 13px 8px;
      color: #8793a6;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .nav {
      display: grid;
      gap: 6px;
    }

    .nav a {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 10px 14px;
      color: #3a495f;
      text-decoration: none;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      transition: .18s ease;
    }

    .nav a:hover,
    .nav a.active {
      color: var(--primary);
      background: var(--primary-soft);
      transform: translateX(2px);
    }

    .nav a.active::before {
      content: "";
      position: absolute;
      left: -18px;
      top: 11px;
      bottom: 11px;
      width: 5px;
      border-radius: 0 10px 10px 0;
      background: var(--primary);
    }

    .nav svg,
    .mini-icon svg,
    .icon-badge svg,
    .metric-icon svg,
    .button svg {
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar-footer {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 22px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(41,98,255,.10), rgba(0,164,184,.10));
    }

    .sidebar-footer strong { display: block; margin-bottom: 8px; font-size: 13px; }
    .sidebar-footer span { color: var(--muted); font-size: 12px; line-height: 1.45; }

    .main {
      min-width: 0;
      padding: 22px 28px 34px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 20px;
      align-items: center;
      height: var(--topbar);
      margin: -22px -28px 22px;
      padding: 16px 28px;
      background: rgba(238,243,248,.78);
      backdrop-filter: blur(22px);
      border-bottom: 1px solid rgba(21,34,56,.06);
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      max-width: 660px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.8);
      box-shadow: 0 8px 24px rgba(19,35,58,.05);
      color: var(--muted);
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font: 600 14px var(--font);
      color: var(--text);
    }

    .top-actions { display: flex; gap: 10px; align-items: center; }
    .circle-btn {
      width: 46px;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.82);
      color: #516178;
      box-shadow: var(--shadow-soft);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 12px 7px 7px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.82);
      box-shadow: var(--shadow-soft);
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      background: linear-gradient(135deg, #26364d, #2962ff);
    }

    .profile strong { display: block; font-size: 13px; }
    .profile span { display: block; color: var(--muted); font-size: 11px; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.48fr) minmax(310px, .72fr);
      gap: 22px;
      margin-bottom: 22px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(21,34,56,.08);
      border-radius: var(--radius);
      background: rgba(255,255,255,.85);
      box-shadow: var(--shadow-soft);
    }

    .panel.pad { padding: 22px; }
    .hero-card {
      min-height: 280px;
      padding: 28px;
      color: #fff;
      background:
        radial-gradient(circle at 88% 14%, rgba(255,255,255,.22), transparent 22%),
        radial-gradient(circle at 20% 85%, rgba(0,255,218,.18), transparent 28%),
        linear-gradient(135deg, #172a48 0%, #2552d9 55%, #00a4b8 100%);
      box-shadow: 0 28px 72px rgba(41,98,255,.22);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -170px;
      bottom: -200px;
      border-radius: 50%;
      border: 60px solid rgba(255,255,255,.10);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      color: rgba(255,255,255,.88);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .hero-card h2 {
      position: relative;
      z-index: 1;
      max-width: 670px;
      margin: 22px 0 12px;
      font-size: clamp(31px, 4.2vw, 55px);
      line-height: .95;
      letter-spacing: -.06em;
    }

    .hero-card p {
      position: relative;
      z-index: 1;
      max-width: 650px;
      margin: 0;
      color: rgba(255,255,255,.78);
      font-size: 15px;
      line-height: 1.65;
    }

    .hero-actions {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 25px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 15px;
      font: 800 13px var(--font);
      text-decoration: none;
      cursor: default;
    }

    .button.primary { color: #14325f; background: #fff; }
    .button.ghost { color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 22px;
      position: relative;
      z-index: 1;
    }

    .status-pill {
      padding: 13px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      background: rgba(255,255,255,.11);
    }

    .status-pill span { display: block; color: rgba(255,255,255,.68); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
    .status-pill strong { display: block; margin-top: 6px; font-size: 20px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .section-head h3 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
    .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--surface-3);
      color: var(--primary);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .health-stack { display: grid; gap: 12px; }
    .mini-card {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--surface-2);
    }

    .mini-icon,
    .metric-icon,
    .icon-badge {
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 16px;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .mini-icon { width: 44px; height: 44px; }
    .metric-icon { width: 48px; height: 48px; }
    .icon-badge { width: 42px; height: 42px; }

    .mini-card h4 { margin: 0; font-size: 13px; }
    .mini-card p { margin: 4px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-card b { font-size: 13px; color: var(--success); }
    .mini-card.warning b { color: var(--warn); }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .metric {
      padding: 18px;
      min-height: 160px;
    }

    .metric-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .metric label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .metric strong {
      display: block;
      margin-top: 10px;
      font-size: 31px;
      letter-spacing: -.05em;
    }

    .trend {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .bar {
      position: relative;
      height: 9px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(21,34,56,.08);
    }
    .bar > i {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
    }
    .bar.warn > i { background: linear-gradient(90deg, #f0a400, #ff7043); }
    .bar.good > i { background: linear-gradient(90deg, #0aa363, #00a4b8); }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(340px, .65fr);
      gap: 22px;
      align-items: start;
    }

    .storage-layout {
      display: grid;
      grid-template-columns: minmax(260px, .75fr) minmax(0, 1.25fr);
      gap: 18px;
      align-items: center;
    }

    .donut {
      --pct: 72%;
      width: min(270px, 100%);
      aspect-ratio: 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--primary) 0 var(--pct), rgba(41,98,255,.10) var(--pct) 100%);
      box-shadow: inset 0 0 0 22px rgba(255,255,255,.78), 0 20px 38px rgba(41,98,255,.10);
    }

    .donut-inner {
      width: 68%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .donut-inner strong { display: block; font-size: 36px; letter-spacing: -.06em; }
    .donut-inner span { color: var(--muted); font-size: 12px; font-weight: 800; }

    .volume-list { display: grid; gap: 12px; }
    .volume {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--surface-2);
    }
    .volume-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 14px; }
    .volume h4 { margin: 0; font-size: 14px; }
    .volume p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    .table-wrap { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; }
    th { color: #7a879b; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; background: var(--surface-2); }
    tr:last-child td { border-bottom: 0; }
    .file-cell { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .file-cell .icon-badge { width: 34px; height: 34px; border-radius: 12px; }
    .status { font-weight: 900; }
    .status.ok { color: var(--success); }
    .status.warn { color: var(--warn); }
    .status.danger { color: var(--danger); }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .app-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface-2);
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .app-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .app-card .icon-badge { margin-bottom: 14px; }
    .app-card h4 { margin: 0 0 5px; font-size: 14px; }
    .app-card p { margin: 0 0 13px; color: var(--muted); font-size: 12px; line-height: 1.45; }

    .switch {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      padding: 3px;
      background: rgba(21,34,56,.14);
    }
    .switch i { display: block; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 3px 9px rgba(0,0,0,.18); }
    .switch.on { background: var(--primary); }
    .switch.on i { transform: translateX(20px); }

    .activity { display: grid; gap: 13px; }
    .event {
      display: grid;
      grid-template-columns: 42px minmax(0,1fr);
      gap: 12px;
      align-items: start;
    }
    .event h4 { margin: 0 0 4px; font-size: 13px; }
    .event p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .event time { display: block; margin-top: 5px; color: #98a3b5; font-size: 11px; font-weight: 800; }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .quick {
      min-height: 100px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--surface-2);
    }
    .quick h4 { margin: 12px 0 4px; font-size: 13px; }
    .quick p { margin: 0; color: var(--muted); font-size: 12px; }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-top: 22px;
    }

    .network-chart {
      height: 178px;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background:
        linear-gradient(rgba(21,34,56,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21,34,56,.06) 1px, transparent 1px),
        #fff;
      background-size: 100% 44px, 58px 100%, auto;
    }
    .network-chart svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .network-chart path {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .network-chart .rx { stroke: var(--primary); }
    .network-chart .tx { stroke: var(--primary-2); opacity: .86; }

    .tasks { display: grid; gap: 12px; }
    .task {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface-2);
    }
    .task h4 { margin: 0 0 4px; font-size: 13px; }
    .task p { margin: 0; color: var(--muted); font-size: 12px; }

    .mobile-menu { display: none; }

    @media (max-width: 1220px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero, .content-grid, .two-col { grid-template-columns: 1fr; }
      .storage-layout { grid-template-columns: 1fr; }
      .app-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sidebar-footer { position: static; margin-top: 18px; }
      .sidebar { overflow: auto; }
    }

    @media (max-width: 880px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(320px, 90vw);
        transform: translateX(-100%);
      }
      .main { padding: 18px; }
      .topbar { margin: -18px -18px 18px; padding: 13px 18px; grid-template-columns: auto minmax(0, 1fr) auto; }
      .mobile-menu { display: grid; }
      .search { max-width: none; }
      .profile { display: none; }
      .hero-card { padding: 22px; }
      .app-grid, .quick-actions, .grid-4, .two-col { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .top-actions .circle-btn:not(.mobile-menu) { display: none; }
      .topbar { gap: 10px; }
      .search input::placeholder { color: transparent; }
      th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { display: none; }
    }
  
    .hidden{display:none!important}
    #toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:grid;gap:10px}
    .toast{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);font-size:13px;font-weight:700;min-width:220px}
    .toast.ok{border-left:4px solid var(--success)} .toast.err{border-left:4px solid var(--danger)} .toast.info{border-left:4px solid var(--primary)} .toast.warn{border-left:4px solid var(--warn)}
    .modal-back{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:24px;background:rgba(19,35,58,.42);backdrop-filter:blur(4px)}
    .modal{width:min(460px,94vw);padding:24px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
    .modal h3{margin:0 0 4px;font-size:18px;letter-spacing:-.03em} .modal p.sub{margin:0 0 16px;color:var(--muted);font-size:13px}
    .modal .field{display:grid;gap:6px;margin-bottom:14px} .modal label{font-size:12px;font-weight:800;color:var(--muted)}
    .modal input,.modal select{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);font:600 14px var(--font);color:var(--text);outline:0}
    .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
    .btn-ghost{height:44px;padding:0 16px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);font:800 13px var(--font);cursor:pointer}
    .btn-pri{height:44px;padding:0 18px;border:0;border-radius:13px;cursor:pointer;font:800 13px var(--font);color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2))}
    .btn-danger{background:linear-gradient(135deg,var(--danger),#ff7a86)}
    .warn-box{padding:12px 14px;border-radius:13px;background:rgba(207,61,70,.08);border:1px solid rgba(207,61,70,.25);color:#9a2730;font-size:13px;font-weight:600;margin-bottom:14px}

    /* ── DRIVE CARDS — vertical, rounded, ~3in tall ── */
    .drive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
    .drive-card{display:flex;flex-direction:column;min-height:288px;padding:20px;border-radius:24px;border:1px solid var(--line);
      background:linear-gradient(170deg,var(--surface) 0%,var(--surface-2) 100%);box-shadow:var(--shadow-soft);position:relative;overflow:hidden;transition:.18s}
    .drive-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
    .drive-card .dot{position:absolute;top:18px;right:18px;width:11px;height:11px;border-radius:50%}
    .dot.ok{background:var(--success);box-shadow:0 0 0 4px rgba(16,166,106,.16)}
    .dot.warn{background:var(--warn);box-shadow:0 0 0 4px rgba(216,138,0,.16)}
    .dot.err{background:var(--danger);box-shadow:0 0 0 4px rgba(207,61,70,.16)}
    .dot.predict{background:#b06bd8;box-shadow:0 0 0 4px rgba(176,107,216,.16)}
    .drive-icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);margin-bottom:14px}
    .drive-card h4{margin:0;font-size:15px;letter-spacing:-.02em}
    .drive-card .model{margin:3px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .drive-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
    .drive-meta .cell span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
    .drive-meta .cell strong{display:block;margin-top:2px;font-size:15px}
    .drive-health{margin-top:auto}
    .health-row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px}
    .health-row .lvl.ok{color:var(--success)} .health-row .lvl.warn{color:var(--warn)} .health-row .lvl.err{color:var(--danger)} .health-row .lvl.predict{color:#b06bd8}
    .drive-actions{display:flex;gap:7px;margin-top:14px}
    .drive-actions button{flex:1;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font:800 11px var(--font);color:#3a495f;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
    .drive-actions button:hover{border-color:var(--primary);color:var(--primary)}
    .drive-actions button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
    .drive-actions button.danger:hover{border-color:var(--danger);color:var(--danger)}
    .drive-card.failed{border-color:rgba(207,61,70,.4)}
    .rebuild-bar{height:7px;border-radius:999px;background:rgba(21,34,56,.08);overflow:hidden;margin-top:8px}
    .rebuild-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .4s}
    .pill-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
    svg.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

  <div class="app">
    <main class="main" style="grid-column:1/-1">
      <header class="topbar" style="grid-template-columns:1fr auto">
        <div>
          <div class="section-head" style="margin:0">
            <div><h3 style="font-size:22px">Storage Manager</h3><p>ForgeRAID arrays, volumes, and physical drive health</p></div>
          </div>
        </div>
        <div class="top-actions">
          <button class="circle-btn" id="refresh" title="Refresh"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.7 5.7L4 16"/><path d="M4 20v-4h4"/></svg></button>
          <button class="button" style="background:var(--primary-soft);color:var(--primary)" id="new-pool"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Create Pool</button>
        </div>
      </header>

      <!-- ARRAY / POOL OVERVIEW -->
      <section class="hero" style="grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr)">
        <article class="panel pad">
          <div class="section-head"><div><h3>Array Overview</h3><p>RAID set state and rebuild status</p></div><span class="chip" id="array-chip">—</span></div>
          <div id="pool-list"></div>
        </article>
        <aside class="panel pad">
          <div class="section-head"><div><h3>Capacity</h3><p>Btrfs volume utilization</p></div></div>
          <div class="storage-layout" style="grid-template-columns:1fr">
            <div class="donut" style="--pct:0%;margin:0 auto" id="donut"><div class="donut-inner"><div><strong id="pct">—</strong><span>Pool used</span></div></div></div>
            <div class="volume-list" id="vols" style="margin-top:16px"></div>
          </div>
        </aside>
      </section>

      <!-- PHYSICAL DRIVES -->
      <section class="panel pad" style="margin-top:22px">
        <div class="section-head"><div><h3>Physical Drives</h3><p>Per-disk SMART health, temperature, and lifecycle actions</p></div><span class="chip" id="drive-chip">—</span></div>
        <div class="drive-grid" id="drives"><div style="color:var(--muted)">Loading drives…</div></div>
      </section>
    </main>
  </div>
  <div id="toasts"></div>
<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
  function token(){try{return localStorage.getItem('forgeos_token')}catch(e){return null}}
  async function api(p,o){o=o||{};var h=Object.assign({},o.headers||{});var t=token();if(t)h.Authorization='Bearer '+t;
    if(o.body&&!h['Content-Type'])h['Content-Type']='application/json';
    try{var r=await fetch(p,Object.assign({},o,{headers:h}));var d=null;try{d=await r.json()}catch(e){}return{ok:r.ok,status:r.status,data:d}}catch(e){return{ok:false,data:null}}}
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
  function fmtBytes(b){b=Number(b)||0;if(b>=1e12)return (b/1e12).toFixed(1)+' TB';if(b>=1e9)return (b/1e9).toFixed(1)+' GB';if(b>=1e6)return (b/1e6).toFixed(0)+' MB';return b+' B'}
  function toast(m,k){k=k||'info';var b=$('#toasts'),e=document.createElement('div');e.className='toast '+k;e.textContent=m;b.appendChild(e);setTimeout(function(){e.style.transition='opacity .2s';e.style.opacity=0;setTimeout(function(){e.remove()},220)},4000)}

  function modal(o){
    var back=document.createElement('div');back.className='modal-back';
    var f=(o.fields||[]).map(function(x){
      if(x.type==='select'){var op=x.options.map(function(q){return '<option value="'+esc(q.value)+'">'+esc(q.label)+'</option>'}).join('');
        return '<div class="field"><label>'+esc(x.label)+'</label><select id="mf-'+x.id+'">'+op+'</select></div>'}
      return '<div class="field"><label>'+esc(x.label)+'</label><input id="mf-'+x.id+'" type="'+(x.type||'text')+'" placeholder="'+esc(x.ph||'')+'" value="'+esc(x.val||'')+'"></div>'}).join('');
    back.innerHTML='<div class="modal"><h3>'+esc(o.title)+'</h3><p class="sub">'+esc(o.sub||'')+'</p>'+(o.warn?'<div class="warn-box">'+esc(o.warn)+'</div>':'')+f+
      '<div class="row"><button class="btn-ghost" data-x>Cancel</button><button class="'+(o.danger?'btn-pri btn-danger':'btn-pri')+'" data-go>'+esc(o.cta||'Confirm')+'</button></div></div>';
    document.body.appendChild(back);var close=function(){back.remove()};
    back.addEventListener('click',function(e){if(e.target===back||e.target.hasAttribute('data-x'))close()});
    $('[data-go]',back).addEventListener('click',function(){var v={};(o.fields||[]).forEach(function(x){v[x.id]=($('#mf-'+x.id,back)||{}).value});
      Promise.resolve(o.onSubmit(v)).then(function(ok){if(ok!==false)close()})});
    var fi=back.querySelector('input,select');if(fi)fi.focus();
  }

  var POOLS=[];
  async function loadPools(){
    var p=(await api('/api/storage/pools')).data; var box=$('#pool-list');POOLS=(p&&p.pools)||[];
    if(POOLS.length){
      var worst='ok',ord={ok:0,predict:1,warn:2,rebuilding:2,err:3};
      POOLS.forEach(function(x){if((ord[x.health]||0)>(ord[worst]||0))worst=x.health});
      $('#array-chip').textContent=POOLS.length+' array'+(POOLS.length>1?'s':'')+' · '+(worst==='ok'?'Healthy':worst);
      box.innerHTML=POOLS.map(function(x){
        var lvl=(x.level||'').toUpperCase().replace('RAID','RAID ');
        var rb=x.rebuild_pct!=null?'<div class="rebuild-bar"><i style="width:'+x.rebuild_pct+'%"></i></div><p style="margin:6px 0 0;color:var(--muted);font-size:12px">Rebuilding · '+x.rebuild_pct+'%</p>':'';
        var hc=x.health==='ok'?'ok':x.health==='err'?'err':'warn';
        return '<div class="volume"><div class="volume-head"><div><h4>'+esc(x.name)+' <span class="chip" style="font-size:10px">'+lvl+'</span></h4>'+
          '<p>'+(x.drives||[]).length+' drives · state '+esc(x.state)+'</p></div>'+
          '<strong class="status '+hc+'">'+(x.health==='ok'?'Online':esc(x.health))+'</strong></div>'+rb+
          '<div class="pill-row"><button class="btn-ghost" data-rebuild="'+esc(x.name)+'" style="height:36px">Run consistency check</button>'+
          '<button class="btn-ghost" data-addd="'+esc(x.name)+'" style="height:36px">Add drive</button></div></div>'}).join('');
      $$('[data-rebuild]').forEach(function(b){b.onclick=function(){doRebuild(b.getAttribute('data-rebuild'))}});
      $$('[data-addd]').forEach(function(b){b.onclick=function(){doAddDrive(b.getAttribute('data-addd'))}});
    } else { $('#array-chip').textContent='No array'; box.innerHTML='<p style="color:var(--muted)">No mdadm arrays configured. Use Create Pool to build one.</p>'; }
  }

  async function loadCapacity(){
    var df=(await api('/api/storage/df')).data;var vl=$('#vols');var tot=0,used=0;
    if(Array.isArray(df)&&df.length){
      vl.innerHTML=df.map(function(v){tot+=v.total||0;used+=v.used||0;var pc=v.total?Math.round(v.used/v.total*100):0;
        var c=pc>=90?'danger':pc>=75?'warn':'good';
        return '<div class="volume"><div class="volume-head"><div><h4>'+esc(v.mount)+'</h4><p>btrfs · '+esc(v.source)+'</p></div><strong>'+fmtBytes(v.used)+' / '+fmtBytes(v.total)+'</strong></div><div class="bar '+c+'"><i style="width:'+pc+'%"></i></div></div>'}).join('');
    } else vl.innerHTML='<p style="color:var(--muted);font-size:13px">No btrfs volumes mounted.</p>';
    var pct=tot?Math.round(used/tot*100):0;$('#pct').textContent=pct+'%';$('#donut').style.setProperty('--pct',pct+'%');
  }

  async function loadDrives(){
    var d=(await api('/api/storage/drives')).data;var box=$('#drives');var drives=(d&&d.drives)||[];
    $('#drive-chip').textContent=drives.length+' drive'+(drives.length!==1?'s':'');
    if(!drives.length){box.innerHTML='<p style="color:var(--muted)">No drives detected.</p>';return}
    box.innerHTML=drives.map(function(dr){
      var lvl=dr.health>=90?'ok':dr.health>=60?'warn':'err';
      var name=esc(dr.name.replace('/dev/',''));
      var temp=dr.temp?dr.temp+' °C':'—';var tcls=dr.temp>=55?'err':dr.temp>=45?'warn':'ok';
      var tran=(dr.type||'').toUpperCase();
      var kind, bus;
      if(tran==='NVME'){kind='NVMe';bus='';}
      else{kind=dr.rota===false?'SSD':dr.rota===true?'HDD':(dr.kind||'HDD');bus=tran||'SATA';}
      var typeCell='<strong>'+esc(kind)+'</strong>'+(bus?'<span style="display:block;color:var(--muted);font-size:11px;font-weight:700;margin-top:1px">'+esc(bus)+'</span>':'');
      return '<div class="drive-card'+(lvl==='err'?' failed':'')+'">'+
        '<span class="dot '+lvl+'"></span>'+
        '<div class="drive-icon"><svg class="ico" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/><circle cx="12" cy="16" r="1"/></svg></div>'+
        '<h4>'+name+'</h4><p class="model">'+esc(dr.model||'Unknown')+'</p>'+
        '<div class="drive-meta"><div class="cell"><span>Capacity</span><strong>'+esc(dr.size||'—')+'</strong></div>'+
        '<div class="cell"><span>Type</span>'+typeCell+'</div>'+
        '<div class="cell"><span>Temp</span><strong class="lvl '+tcls+'" style="color:var(--'+(tcls==='ok'?'success':tcls==='warn'?'warn':'danger')+')">'+temp+'</strong></div>'+
        '<div class="cell"><span>Health</span><strong>'+dr.health+'%</strong></div></div>'+
        '<div class="drive-health"><div class="health-row"><span>SMART status</span><span class="lvl '+lvl+'">'+(lvl==='ok'?'Passed':lvl==='warn'?'Warning':'Failing')+'</span></div>'+
        '<div class="bar '+(lvl==='ok'?'good':lvl==='warn'?'warn':'danger')+'"><i style="width:'+dr.health+'%"></i></div></div>'+
        '<div class="drive-actions">'+
        '<button data-spin="'+esc(dr.name)+'" title="Spin down"><svg viewBox="0 0 24 24"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>Spin</button>'+
        '<button data-replace="'+esc(dr.name)+'" title="Replace"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8M20 4v4h-4"/></svg>Replace</button>'+
        '<button class="danger" data-smart="'+esc(dr.name)+'" title="SMART detail"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h0"/><circle cx="12" cy="12" r="9"/></svg>Info</button>'+
        '</div></div>'}).join('');
    $$('[data-spin]').forEach(function(b){b.onclick=function(){doSpin(b.getAttribute('data-spin'))}});
    $$('[data-replace]').forEach(function(b){b.onclick=function(){doReplace(b.getAttribute('data-replace'))}});
    $$('[data-smart]').forEach(function(b){b.onclick=function(){doSmart(b.getAttribute('data-smart'))}});
  }

  // ── actions ──
  function poolOpts(){return POOLS.map(function(p){return{value:p.name,label:p.name+' ('+(p.level||'').toUpperCase()+')'}})}
  async function doSpin(dev){
    var r=await api('/api/storage/drive/spindown',{method:'POST',body:JSON.stringify({device:dev.replace('/dev/','')})});
    toast(r.ok?dev+' sent to standby':(r.data&&r.data.detail)||'Spin-down failed',r.ok?'ok':'err');
  }
  function doReplace(dev){
    modal({title:'Replace drive',sub:'Remove '+dev+' from its array and rebuild onto a new disk.',
      warn:'This marks the old drive failed and starts a rebuild. The array runs degraded until rebuild completes.',
      danger:true,cta:'Start replacement',
      fields:[{id:'pool',label:'Array',type:'select',options:poolOpts()},
        {id:'new',label:'New drive (e.g. sdg)',ph:'sdg'}],
      onSubmit:async function(v){if(!v.new){toast('New drive required','warn');return false}
        var r=await api('/api/storage/drive/replace',{method:'POST',body:JSON.stringify({pool:v.pool,old:dev.replace('/dev/',''),new:v.new})});
        toast(r.ok?'Replacement started; rebuilding':(r.data&&r.data.detail)||'Replace failed',r.ok?'ok':'err');if(r.ok){loadPools();loadDrives()}return r.ok}});
  }
  async function doSmart(dev){
    var d=(await api('/api/storage/smart/'+dev.replace('/dev/',''))).data;
    modal({title:'SMART · '+dev,sub:'Raw smartctl output',fields:[],cta:'Close',onSubmit:function(){return true}});
    setTimeout(function(){var m=$('.modal');if(m&&d)m.insertAdjacentHTML('beforeend','<pre style="max-height:300px;overflow:auto;background:var(--surface-2);padding:12px;border-radius:12px;font:500 11px JetBrains Mono,monospace;white-space:pre-wrap">'+esc((d.output||'').slice(0,4000))+'</pre>')},30);
  }
  function doRebuild(pool){
    modal({title:'Consistency check',sub:'Run a parity scrub on '+pool+'. Safe to run while online but uses disk I/O.',cta:'Start check',
      fields:[],onSubmit:async function(){var r=await api('/api/storage/pool/rebuild',{method:'POST',body:JSON.stringify({pool:pool})});
        toast(r.ok?'Consistency check started':(r.data&&r.data.detail)||'Could not start',r.ok?'ok':'err');return r.ok}});
  }
  function doAddDrive(pool){
    modal({title:'Add drive to '+pool,sub:'Add a spare/expansion disk to the array.',cta:'Add drive',
      fields:[{id:'device',label:'Drive (e.g. sdg)',ph:'sdg'}],
      onSubmit:async function(v){if(!v.device){toast('Drive required','warn');return false}
        var r=await api('/api/storage/drive',{method:'POST',body:JSON.stringify({pool:pool,device:v.device})});
        toast(r.ok?'Drive added':(r.data&&r.data.detail)||'Add failed',r.ok?'ok':'err');if(r.ok){loadPools();loadDrives()}return r.ok}});
  }
  function doNewPool(){
    modal({title:'Create storage pool',sub:'Build a new mdadm RAID array from available drives.',cta:'Create pool',
      warn:'All data on the selected drives will be erased.',danger:true,
      fields:[{id:'name',label:'Pool name',ph:'main'},
        {id:'level',label:'RAID level',type:'select',options:[{value:'1',label:'RAID 1 — mirror (2 drives)'},{value:'5',label:'RAID 5 — single parity (3+)'},{value:'6',label:'RAID 6 — double parity (4+)'},{value:'10',label:'RAID 10 — striped mirror (4+)'},{value:'0',label:'RAID 0 — stripe, no redundancy'}]},
        {id:'drives',label:'Drives (comma-separated, e.g. sdb,sdc,sdd)',ph:'sdb,sdc,sdd'}],
      onSubmit:async function(v){var ds=(v.drives||'').split(',').map(function(s){return s.trim()}).filter(Boolean);
        if(!v.name||ds.length<2){toast('Name and 2+ drives required','warn');return false}
        var r=await api('/api/storage/pool',{method:'POST',body:JSON.stringify({name:v.name,level:parseInt(v.level,10),drives:ds})});
        toast(r.ok?'Pool created':(r.data&&r.data.detail)||'Create failed',r.ok?'ok':'err');if(r.ok){loadPools();loadDrives();loadCapacity()}return r.ok}});
  }

  function refresh(){loadPools();loadCapacity();loadDrives()}
  document.addEventListener('DOMContentLoaded',function(){
    $('#refresh').onclick=function(){refresh();toast('Refreshed','info')};
    $('#new-pool').onclick=doNewPool;
    refresh();
  });
})();
</script>
</body>
</html>
