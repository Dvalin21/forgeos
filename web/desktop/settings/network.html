<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Settings - ForgeOS</title>
  <link rel="stylesheet" href="../css/forgeos.css">
</head>
<body>
  <forge-topnav></forge-topnav>
  
  <div class="page-content">
    <h2>Network Settings</h2>
    
    <div class="settings-tabs">
      <a href="storage.html" class="tab"><svg viewBox="0 0 24 24" class="svg-icon"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="10" y1="2" x2="10" y2="22"/></svg> Storage</a>
      <a href="network.html" class="tab active"><svg viewBox="0 0 24 24" class="svg-icon"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14M16.24 7.76a6 6 0 0 1 0 8.48M7.76 16.24a6 6 0 0 1 0-8.48"/></svg> Network</a>
      <a href="backup.html" class="tab"><svg viewBox="0 0 24 24" class="svg-icon"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> Backup</a>
      <a href="system.html" class="tab"><svg viewBox="0 0 24 24" class="svg-icon"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> System</a>
    </div>
    
    <div class="settings-content">
      <div class="card mb-md">
        <h3>Network Interfaces</h3>
        <p>Configure your network interfaces.</p>
        <table>
          <thead>
            <tr>
              <th>Interface</th>
              <th>IP Address</th>
              <th>Status</th>
              <th>Speed</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>eth0</td>
              <td>192.168.1.100</td>
              <td><span class="status-dot active"></span>Up</td>
              <td>1 Gbps</td>
            </tr>
            <tr>
              <td>eth1</td>
              <td>10.0.0.100</td>
              <td><span class="status-dot error"></span>Down</td>
              <td>10 Gbps</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="card">
        <h3>DNS Settings</h3>
        <p>Configure DNS servers for name resolution.</p>
        <button class="btn">Edit DNS</button>
      </div>
    </div>
  </div>
  
  <script src="../components/forge-topnav.js"></script>
</body>
</html>
