<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - ForgeOS</title>
  <link rel="stylesheet" href="css/forgeos.css">
</head>
<body>
  <forge-topnav></forge-topnav>
  
  <div class="page-content" style="margin-top: var(--topnav-height); padding: var(--space-md);">
    <h2>Settings</h2>
    
    <div class="settings-tabs" style="display: flex; gap: var(--space-sm); margin: var(--space-lg) 0; border-bottom: 1px solid var(--border);">
      <a href="settings/storage.html" class="tab active">📂 Storage</a>
      <a href="settings/network.html" class="tab">🌐 Network</a>
      <a href="settings/backup.html" class="tab">💾 Backup</a>
      <a href="settings/system.html" class="tab">⚙️ System</a>
    </div>
    
  <div class="settings-content">
    <h3>Appearnce</h3>
    <div class="wallpaper-section" style="margin-top: var(--space-lg);">
      <h4>Wallpaper</h4>
      <div class="wallpaper-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-md); margin-top: var(--space-md);">
        <!-- Wallpapers will be loaded from manifest.json via JavaScript -->
      </div>
    </div>
    
    <h3 style="margin-top: var(--space-xl);">Theme</h3>
    <div class="theme-options" style="margin-top: var(--space-md);">
      <button class="btn active">Dark (Ocean Deep)</button>
      <button class="btn">Light (Future)</button>
    </div>
  </div>
  </div>
  
  <script src="../components/forge-topnav.js"></script>
  <script src="wallpaper-selector.js"></script>
</body>
</html>
