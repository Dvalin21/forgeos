<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content='width=device-width, initial-scale=1'>
<title>Apps & Services · ForgeNAS</title>
<style>
    :root {
      --bg: #eef3f8;
      --surface: #ffffff;
      --surface-2: #f7faff;
      --surface-3: #edf4ff;
      --text: #152238;
      --muted: #68758b;
      --line: rgba(21,34,56,.10);
      --primary: #2962ff;
      --primary-2: #00a4b8;
      --primary-soft: rgba(41,98,255,.12);
      --success: #10a66a;
      --warn: #d88a00;
      --danger: #cf3d46;
      --shadow: 0 18px 55px rgba(19,35,58,.12);
      --shadow-soft: 0 10px 30px rgba(19,35,58,.08);
      --radius: 24px;
      --radius-sm: 16px;
      --sidebar: 292px;
      --topbar: 76px;
      --font: Inter, Roboto, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(circle at 15% 8%, rgba(41,98,255,.18), transparent 28%),
        radial-gradient(circle at 92% 12%, rgba(0,164,184,.16), transparent 30%),
        linear-gradient(135deg, #f8fbff 0%, var(--bg) 45%, #e8f1fb 100%);
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 18px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(24px);
      box-shadow: 8px 0 36px rgba(19,35,58,.06);
      z-index: 4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px 22px;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      box-shadow: 0 16px 30px rgba(41,98,255,.28);
    }

    svg { width: 22px; height: 22px; display: block; }
    .brand h1 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .nav-title {
      margin: 18px 13px 8px;
      color: #8793a6;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .nav {
      display: grid;
      gap: 6px;
    }

    .nav a {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 10px 14px;
      color: #3a495f;
      text-decoration: none;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      transition: .18s ease;
    }

    .nav a:hover,
    .nav a.active {
      color: var(--primary);
      background: var(--primary-soft);
      transform: translateX(2px);
    }

    .nav a.active::before {
      content: "";
      position: absolute;
      left: -18px;
      top: 11px;
      bottom: 11px;
      width: 5px;
      border-radius: 0 10px 10px 0;
      background: var(--primary);
    }

    .nav svg,
    .mini-icon svg,
    .icon-badge svg,
    .metric-icon svg,
    .button svg {
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar-footer {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 22px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(41,98,255,.10), rgba(0,164,184,.10));
    }

    .sidebar-footer strong { display: block; margin-bottom: 8px; font-size: 13px; }
    .sidebar-footer span { color: var(--muted); font-size: 12px; line-height: 1.45; }

    .main {
      min-width: 0;
      padding: 22px 28px 34px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 20px;
      align-items: center;
      height: var(--topbar);
      margin: -22px -28px 22px;
      padding: 16px 28px;
      background: rgba(238,243,248,.78);
      backdrop-filter: blur(22px);
      border-bottom: 1px solid rgba(21,34,56,.06);
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      max-width: 660px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.8);
      box-shadow: 0 8px 24px rgba(19,35,58,.05);
      color: var(--muted);
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font: 600 14px var(--font);
      color: var(--text);
    }

    .top-actions { display: flex; gap: 10px; align-items: center; }
    .circle-btn {
      width: 46px;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.82);
      color: #516178;
      box-shadow: var(--shadow-soft);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 12px 7px 7px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.82);
      box-shadow: var(--shadow-soft);
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      background: linear-gradient(135deg, #26364d, #2962ff);
    }

    .profile strong { display: block; font-size: 13px; }
    .profile span { display: block; color: var(--muted); font-size: 11px; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.48fr) minmax(310px, .72fr);
      gap: 22px;
      margin-bottom: 22px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(21,34,56,.08);
      border-radius: var(--radius);
      background: rgba(255,255,255,.85);
      box-shadow: var(--shadow-soft);
    }

    .panel.pad { padding: 22px; }
    .hero-card {
      min-height: 280px;
      padding: 28px;
      color: #fff;
      background:
        radial-gradient(circle at 88% 14%, rgba(255,255,255,.22), transparent 22%),
        radial-gradient(circle at 20% 85%, rgba(0,255,218,.18), transparent 28%),
        linear-gradient(135deg, #172a48 0%, #2552d9 55%, #00a4b8 100%);
      box-shadow: 0 28px 72px rgba(41,98,255,.22);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -170px;
      bottom: -200px;
      border-radius: 50%;
      border: 60px solid rgba(255,255,255,.10);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      color: rgba(255,255,255,.88);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .hero-card h2 {
      position: relative;
      z-index: 1;
      max-width: 670px;
      margin: 22px 0 12px;
      font-size: clamp(31px, 4.2vw, 55px);
      line-height: .95;
      letter-spacing: -.06em;
    }

    .hero-card p {
      position: relative;
      z-index: 1;
      max-width: 650px;
      margin: 0;
      color: rgba(255,255,255,.78);
      font-size: 15px;
      line-height: 1.65;
    }

    .hero-actions {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 25px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 15px;
      font: 800 13px var(--font);
      text-decoration: none;
      cursor: default;
    }

    .button.primary { color: #14325f; background: #fff; }
    .button.ghost { color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 22px;
      position: relative;
      z-index: 1;
    }

    .status-pill {
      padding: 13px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      background: rgba(255,255,255,.11);
    }

    .status-pill span { display: block; color: rgba(255,255,255,.68); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
    .status-pill strong { display: block; margin-top: 6px; font-size: 20px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .section-head h3 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
    .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--surface-3);
      color: var(--primary);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .health-stack { display: grid; gap: 12px; }
    .mini-card {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--surface-2);
    }

    .mini-icon,
    .metric-icon,
    .icon-badge {
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 16px;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .mini-icon { width: 44px; height: 44px; }
    .metric-icon { width: 48px; height: 48px; }
    .icon-badge { width: 42px; height: 42px; }

    .mini-card h4 { margin: 0; font-size: 13px; }
    .mini-card p { margin: 4px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-card b { font-size: 13px; color: var(--success); }
    .mini-card.warning b { color: var(--warn); }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .metric {
      padding: 18px;
      min-height: 160px;
    }

    .metric-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .metric label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .metric strong {
      display: block;
      margin-top: 10px;
      font-size: 31px;
      letter-spacing: -.05em;
    }

    .trend {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .bar {
      position: relative;
      height: 9px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(21,34,56,.08);
    }
    .bar > i {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
    }
    .bar.warn > i { background: linear-gradient(90deg, #f0a400, #ff7043); }
    .bar.good > i { background: linear-gradient(90deg, #0aa363, #00a4b8); }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(340px, .65fr);
      gap: 22px;
      align-items: start;
    }

    .storage-layout {
      display: grid;
      grid-template-columns: minmax(260px, .75fr) minmax(0, 1.25fr);
      gap: 18px;
      align-items: center;
    }

    .donut {
      --pct: 72%;
      width: min(270px, 100%);
      aspect-ratio: 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--primary) 0 var(--pct), rgba(41,98,255,.10) var(--pct) 100%);
      box-shadow: inset 0 0 0 22px rgba(255,255,255,.78), 0 20px 38px rgba(41,98,255,.10);
    }

    .donut-inner {
      width: 68%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .donut-inner strong { display: block; font-size: 36px; letter-spacing: -.06em; }
    .donut-inner span { color: var(--muted); font-size: 12px; font-weight: 800; }

    .volume-list { display: grid; gap: 12px; }
    .volume {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--surface-2);
    }
    .volume-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 14px; }
    .volume h4 { margin: 0; font-size: 14px; }
    .volume p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    .table-wrap { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; }
    th { color: #7a879b; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; background: var(--surface-2); }
    tr:last-child td { border-bottom: 0; }
    .file-cell { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .file-cell .icon-badge { width: 34px; height: 34px; border-radius: 12px; }
    .status { font-weight: 900; }
    .status.ok { color: var(--success); }
    .status.warn { color: var(--warn); }
    .status.danger { color: var(--danger); }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .app-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface-2);
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .app-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .app-card .icon-badge { margin-bottom: 14px; }
    .app-card h4 { margin: 0 0 5px; font-size: 14px; }
    .app-card p { margin: 0 0 13px; color: var(--muted); font-size: 12px; line-height: 1.45; }

    .switch {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      padding: 3px;
      background: rgba(21,34,56,.14);
    }
    .switch i { display: block; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 3px 9px rgba(0,0,0,.18); }
    .switch.on { background: var(--primary); }
    .switch.on i { transform: translateX(20px); }

    .activity { display: grid; gap: 13px; }
    .event {
      display: grid;
      grid-template-columns: 42px minmax(0,1fr);
      gap: 12px;
      align-items: start;
    }
    .event h4 { margin: 0 0 4px; font-size: 13px; }
    .event p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .event time { display: block; margin-top: 5px; color: #98a3b5; font-size: 11px; font-weight: 800; }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .quick {
      min-height: 100px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--surface-2);
    }
    .quick h4 { margin: 12px 0 4px; font-size: 13px; }
    .quick p { margin: 0; color: var(--muted); font-size: 12px; }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-top: 22px;
    }

    .network-chart {
      height: 178px;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background:
        linear-gradient(rgba(21,34,56,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21,34,56,.06) 1px, transparent 1px),
        #fff;
      background-size: 100% 44px, 58px 100%, auto;
    }
    .network-chart svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .network-chart path {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .network-chart .rx { stroke: var(--primary); }
    .network-chart .tx { stroke: var(--primary-2); opacity: .86; }

    .tasks { display: grid; gap: 12px; }
    .task {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface-2);
    }
    .task h4 { margin: 0 0 4px; font-size: 13px; }
    .task p { margin: 0; color: var(--muted); font-size: 12px; }

    .mobile-menu { display: none; }

    @media (max-width: 1220px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero, .content-grid, .two-col { grid-template-columns: 1fr; }
      .storage-layout { grid-template-columns: 1fr; }
      .app-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sidebar-footer { position: static; margin-top: 18px; }
      .sidebar { overflow: auto; }
    }

    @media (max-width: 880px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(320px, 90vw);
        transform: translateX(-100%);
      }
      .main { padding: 18px; }
      .topbar { margin: -18px -18px 18px; padding: 13px 18px; grid-template-columns: auto minmax(0, 1fr) auto; }
      .mobile-menu { display: grid; }
      .search { max-width: none; }
      .profile { display: none; }
      .hero-card { padding: 22px; }
      .app-grid, .quick-actions, .grid-4, .two-col { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .top-actions .circle-btn:not(.mobile-menu) { display: none; }
      .topbar { gap: 10px; }
      .search input::placeholder { color: transparent; }
      th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { display: none; }
    }
  
    .hidden{display:none!important}
    #toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:grid;gap:10px}
    .toast{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);font-size:13px;font-weight:700;min-width:220px;max-width:420px}
    .toast.ok{border-left:4px solid var(--success)} .toast.err{border-left:4px solid var(--danger)} .toast.info{border-left:4px solid var(--primary)} .toast.warn{border-left:4px solid var(--warn)}
    .modal-back{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:24px;background:rgba(19,35,58,.42);backdrop-filter:blur(4px)}
    .modal{width:min(560px,95vw);padding:24px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);max-height:92vh;overflow:auto}
    .modal.big{width:min(820px,95vw)} .modal.huge{width:min(1000px,96vw)}
    .modal h3{margin:0 0 4px;font-size:19px;letter-spacing:-.03em} .modal p.sub{margin:0 0 16px;color:var(--muted);font-size:13px}
    .modal .field{display:grid;gap:6px;margin-bottom:14px} .modal label{font-size:12px;font-weight:800;color:var(--muted)}
    .modal input,.modal select,.modal textarea{padding:0 14px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);font:600 14px var(--font);color:var(--text);outline:0;width:100%;box-sizing:border-box}
    .modal input,.modal select{height:44px} .modal textarea{padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;min-height:160px;resize:vertical;line-height:1.5}
    .btn-ghost{height:44px;padding:0 16px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);font:800 13px var(--font);cursor:pointer}
    .btn-pri{height:44px;padding:0 18px;border:0;border-radius:13px;cursor:pointer;font:800 13px var(--font);color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2))}
    .btn-danger{background:linear-gradient(135deg,var(--danger),#ff7a86)}
    .warn-box{padding:12px 14px;border-radius:13px;background:rgba(207,61,70,.08);border:1px solid rgba(207,61,70,.25);color:#9a2730;font-size:13px;font-weight:600;margin-bottom:14px}
    svg.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

    /* tabs */
    .tabs{display:flex;gap:6px;padding:6px;background:var(--surface-2);border-radius:14px;border:1px solid var(--line);width:fit-content;margin-bottom:18px}
    .tab{padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:800;color:#3a495f;transition:.15s;background:transparent;border:0}
    .tab.active{background:var(--surface);color:var(--primary);box-shadow:0 2px 8px rgba(41,98,255,.12)}
    .tab .badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:900}
    /* sub-tabs (in-page) */
    .subtabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
    .subtab{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border:0;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px}
    .subtab.active{color:var(--primary);border-bottom-color:var(--primary)}

    /* unified card grid */
    .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .card{position:relative;display:flex;flex-direction:column;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow-soft);transition:.15s}
    .card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .card-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none;font-size:22px}
    .card-icon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9}
    .ic-svc{background:linear-gradient(135deg,var(--primary),var(--primary-2))}
    .ic-ctr{background:linear-gradient(135deg,#b06bd8,#7d5ce8)}
    .ic-app{background:linear-gradient(135deg,#0bbf78,var(--success))}
    .ic-store{background:linear-gradient(135deg,#e8835c,#f4a200)}
    .ic-compose{background:linear-gradient(135deg,#3a495f,#5a6c87)}
    .card h4{margin:0;font-size:15px;letter-spacing:-.02em} .card .meta{margin:2px 0 0;color:var(--muted);font-size:12px;font-weight:600;word-break:break-all}
    .card .desc{color:var(--muted);font-size:12px;font-weight:600;margin:0 0 12px;line-height:1.5}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.03em}
    .pill.ok{background:rgba(16,166,106,.14);color:var(--success)} .pill.warn{background:rgba(216,138,0,.14);color:var(--warn)} .pill.err{background:rgba(207,61,70,.14);color:var(--danger)} .pill.idle{background:var(--surface-3);color:var(--muted)}
    .pill.update{background:rgba(216,138,0,.16);color:var(--warn);position:absolute;top:14px;right:14px;cursor:pointer}
    .pill.update svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4}
    .badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
    .card-actions button{flex:1;min-width:0;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:800 11px var(--font);color:#3a495f;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:.15s;padding:0 8px}
    .card-actions button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
    .card-actions button.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
    .card-actions button:disabled{opacity:.4;cursor:default}
    .card-actions button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}

    .ov-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
    .ov-card{padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-soft)}
    .ov-card .lbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .ov-card .val{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
    .ov-card .val small{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}

    .empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
    .powered{margin-top:24px;padding:12px 16px;background:var(--surface-3);border-radius:12px;font-size:12px;color:var(--muted);font-weight:600;text-align:center}

    /* wizard / advanced expander */
    .wz-tier{display:flex;gap:6px;padding:5px;background:var(--surface-2);border-radius:12px;border:1px solid var(--line);margin-bottom:18px}
    .wz-tier button{flex:1;padding:9px 14px;border:0;background:transparent;border-radius:8px;font:800 12px var(--font);color:var(--muted);cursor:pointer;transition:.15s}
    .wz-tier button.active{background:var(--surface);color:var(--primary);box-shadow:0 2px 6px rgba(41,98,255,.1)}
    .wz-tier button.advanced.active{color:var(--warn);background:rgba(216,138,0,.08)}
    details.adv{margin:14px 0;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);overflow:hidden}
    details.adv > summary{padding:12px 16px;cursor:pointer;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px;list-style:none}
    details.adv > summary::-webkit-details-marker{display:none}
    details.adv > summary::after{content:'▾';margin-left:auto;color:var(--muted);transition:.15s}
    details.adv[open] > summary::after{transform:rotate(180deg)}
    details.adv > .body{padding:0 16px 14px}
    .pair-list{display:grid;gap:6px;margin-bottom:8px}
    .pair-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
    .pair-row input{height:38px!important;padding:0 12px!important}
    .pair-row button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--danger);cursor:pointer;font-weight:900}
    .add-pair{height:36px;padding:0 14px;border:1px dashed var(--line);background:transparent;border-radius:10px;font:700 12px var(--font);color:var(--muted);cursor:pointer;width:100%}
    .add-pair:hover{border-color:var(--primary);color:var(--primary)}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .checkbox-field{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);cursor:pointer;font-size:13px;font-weight:600;color:var(--text)}
    .checkbox-field input{width:16px;height:16px;accent-color:var(--primary)}

    /* compose editor */
    .file-drop{padding:24px;border:2px dashed var(--line);border-radius:13px;background:var(--surface-2);text-align:center;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;margin-bottom:14px;transition:.15s}
    .file-drop:hover,.file-drop.over{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
    .file-drop b{display:block;color:var(--text);margin-bottom:4px;font-weight:800;font-size:14px}
</style>
</head>
<body>

  <div class="app"><main class="main" style="grid-column:1/-1">
    <header class="topbar" style="grid-template-columns:1fr auto">
      <div class="section-head" style="margin:0"><div><h3 style="font-size:22px">Apps &amp; Services</h3><p>System services, containers, compose stacks, and the app catalog</p></div></div>
      <div class="top-actions">
        <button class="circle-btn" id="refresh" title="Refresh"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8M20 4v4h-4M20 12a8 8 0 0 1-13.7 5.7L4 16M4 20v-4h4"/></svg></button>
        <button class="button" id="check-updates" style="background:var(--primary-soft);color:var(--primary)"><svg class="ico" viewBox="0 0 24 24"><path d="M12 2v8M9 7l3 3 3-3M5 16a8 8 0 0 0 14 0"/></svg>Check updates</button>
      </div>
    </header>

    <div class="ov-strip">
      <div class="ov-card"><div class="lbl">Services</div><div class="val" id="ov-svc">—</div></div>
      <div class="ov-card"><div class="lbl">Containers</div><div class="val" id="ov-ctr">—</div></div>
      <div class="ov-card"><div class="lbl">Compose stacks</div><div class="val" id="ov-cmp">—</div></div>
      <div class="ov-card"><div class="lbl">Updates available</div><div class="val" id="ov-up">—</div></div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-t="catalog">Catalog</button>
      <button class="tab" data-t="containers">Containers <span class="badge" id="b-ctr">—</span></button>
      <button class="tab" data-t="services">Services <span class="badge" id="b-svc">—</span></button>
    </div>

    <section id="tab-catalog"><div class="grid-cards" id="catalog-grid"><div class="empty">Loading catalog…</div></div></section>

    <section id="tab-containers" class="hidden">
      <div class="subtabs">
        <button class="subtab active" data-st="ctrs">Containers</button>
        <button class="subtab" data-st="compose">Compose Stacks</button>
        <div style="flex:1"></div>
        <button class="btn-pri" id="new-ctr" style="height:36px;padding:0 14px;font-size:12px;margin-bottom:6px">+ New container</button>
        <button class="btn-ghost" id="new-compose" style="height:36px;padding:0 14px;font-size:12px;margin-bottom:6px;margin-left:6px">+ New compose</button>
      </div>
      <div id="sub-ctrs"><div class="grid-cards" id="containers-grid"><div class="empty">Loading containers…</div></div></div>
      <div id="sub-compose" class="hidden"><div class="grid-cards" id="compose-grid"><div class="empty">Loading stacks…</div></div></div>
    </section>

    <section id="tab-services" class="hidden">
      <div class="grid-cards" id="services-grid"><div class="empty">Loading services…</div></div>
    </section>

    <div class="powered">Object storage powered by RustFS · Container runtimes: Docker &amp; Incus</div>
  </main></div>
  <div id="toasts"></div>
<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
  function token(){try{return localStorage.getItem('forgeos_token')}catch(e){return null}}
  async function api(p,o){o=o||{};var h=Object.assign({},o.headers||{});var t=token();if(t)h.Authorization='Bearer '+t;
    if(o.body&&!h['Content-Type'])h['Content-Type']='application/json';
    try{var r=await fetch(p,Object.assign({},o,{headers:h}));var d=null;try{d=await r.json()}catch(e){}return{ok:r.ok,status:r.status,data:d}}catch(e){return{ok:false,data:null}}}
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
  function toast(m,k){k=k||'info';var b=$('#toasts'),e=document.createElement('div');e.className='toast '+k;e.textContent=m;b.appendChild(e);setTimeout(function(){e.style.transition='opacity .2s';e.style.opacity=0;setTimeout(function(){e.remove()},220)},4200)}

  // ── modal helper ──
  function modal(o){
    var back=document.createElement('div');back.className='modal-back';
    back.innerHTML='<div class="modal '+(o.size||'')+'"><h3>'+esc(o.title)+'</h3>'+(o.sub?'<p class="sub">'+esc(o.sub)+'</p>':'')+(o.warn?'<div class="warn-box">'+esc(o.warn)+'</div>':'')+(o.html||'')+
      '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">'+(o.cta===null?'<button class="btn-pri" data-x>Close</button>':'<button class="btn-ghost" data-x>Cancel</button><button class="'+(o.danger?'btn-pri btn-danger':'btn-pri')+'" data-go>'+esc(o.cta||'Save')+'</button>')+'</div></div>';
    document.body.appendChild(back);var close=function(){back.remove()};
    back.addEventListener('click',function(e){if(e.target===back||e.target.hasAttribute('data-x'))close()});
    if(o.onSubmit){$('[data-go]',back).addEventListener('click',function(){Promise.resolve(o.onSubmit(back)).then(function(ok){if(ok!==false)close()})})}
    return {el:back,close:close};
  }

  // ── helpers for repeating key/value pair lists ──
  function pairList(containerEl,initial,phK,phV){
    function add(k,v){
      var row=document.createElement('div');row.className='pair-row';
      row.innerHTML='<input placeholder="'+esc(phK)+'" value="'+esc(k||'')+'"><input placeholder="'+esc(phV)+'" value="'+esc(v||'')+'"><button type="button">×</button>';
      $('button',row).onclick=function(){row.remove()};
      containerEl.appendChild(row);
    }
    (initial||[]).forEach(function(p){add(p[0],p[1])});
    return {add:add,values:function(){return $$('.pair-row',containerEl).map(function(r){var i=$$('input',r);return [i[0].value.trim(),i[1].value.trim()]}).filter(function(p){return p[0]||p[1]})}};
  }
  function singleList(containerEl,initial,ph){
    function add(v){
      var row=document.createElement('div');row.className='pair-row';row.style.gridTemplateColumns='1fr auto';
      row.innerHTML='<input placeholder="'+esc(ph)+'" value="'+esc(v||'')+'"><button type="button">×</button>';
      $('button',row).onclick=function(){row.remove()};
      containerEl.appendChild(row);
    }
    (initial||[]).forEach(add);
    return {add:add,values:function(){return $$('.pair-row input',containerEl).map(function(i){return i.value.trim()}).filter(Boolean)}};
  }

  // ── catalog ──
  var CATALOG=[
    {id:'jellyfin',name:'Jellyfin',cat:'Media',icon:'🎬',desc:'Free media server for movies, TV, music.',image:'jellyfin/jellyfin:latest',ports:['8096:8096'],vols:['/srv/nas/main/Media:/media:ro']},
    {id:'plex',name:'Plex',cat:'Media',icon:'▶',desc:'Personal media library with mobile/TV apps.',image:'plexinc/pms-docker:latest',ports:['32400:32400']},
    {id:'immich',name:'Immich',cat:'Photos',icon:'📷',desc:'Photo and video backup with mobile apps.',image:'ghcr.io/immich-app/immich-server:release',ports:['2283:3001'],compose:true},
    {id:'nextcloud',name:'Nextcloud',cat:'Productivity',icon:'☁',desc:'Files, calendar, contacts, collaboration.',image:'nextcloud:latest',ports:['8080:80']},
    {id:'vaultwarden',name:'Vaultwarden',cat:'Security',icon:'🔐',desc:'Bitwarden-compatible password manager.',image:'vaultwarden/server:latest',ports:['8200:80']},
    {id:'pihole',name:'Pi-hole',cat:'Network',icon:'🛡',desc:'Network-wide ad blocking via DNS.',image:'pihole/pihole:latest',ports:['53:53/udp','53:53/tcp','8181:80']},
    {id:'homeassistant',name:'Home Assistant',cat:'Automation',icon:'🏠',desc:'Open-source home automation.',image:'homeassistant/home-assistant:stable',ports:['8123:8123']},
    {id:'portainer',name:'Portainer',cat:'Tools',icon:'⚓',desc:'Advanced container management UI.',image:'portainer/portainer-ce:latest',ports:['9000:9000']},
    {id:'nginx-pm',name:'Nginx Proxy Manager',cat:'Network',icon:'🌐',desc:'Reverse proxy with cert UI.',image:'jc21/nginx-proxy-manager:latest',ports:['80:80','443:443','81:81']},
    {id:'code-server',name:'Code Server',cat:'Tools',icon:'💻',desc:'VS Code in the browser on your NAS.',image:'codercom/code-server:latest',ports:['8443:8080']}
  ];

  var NATIVE_SERVICES=[
    {key:'nginx',name:'nginx',unit:'nginx',desc:'Web server and reverse proxy.',icon:'svc',configure:'nginx'},
    {key:'samba',name:'Samba (SMB shares)',unit:'smbd',desc:'Windows-compatible file sharing.',icon:'svc',configure:'samba'},
    {key:'forge-object-storage',name:'Forge Object Storage',unit:'forge-object-storage',desc:'S3-compatible object storage for buckets.',icon:'store',configure:'object-storage'},
    {key:'docker',name:'Docker engine',unit:'docker',desc:'Container runtime.',icon:'svc'},
    {key:'incus',name:'Container hypervisor',unit:'incus',desc:'System containers and lightweight VMs.',icon:'svc'},
    {key:'ssh',name:'SSH',unit:'ssh',desc:'Remote shell access. Configure in Security Center.',icon:'svc'},
    {key:'fail2ban',name:'Fail2ban',unit:'fail2ban',desc:'Bans IPs after failed logins.',icon:'svc'},
    {key:'smartd',name:'SMART monitoring',unit:'smartd',desc:'Drive SMART monitoring.',icon:'svc'}
  ];

  var STATE={containers:[],services:[],compose:[],updateMap:{}};
  function recalc(){
    var svcUp=STATE.services.filter(function(s){return s.status==='running'}).length;
    var ctrUp=STATE.containers.filter(function(c){return c.running}).length;
    var cmpUp=STATE.compose.filter(function(p){return /running/i.test(p.status||'')}).length;
    var upd=Object.values(STATE.updateMap).filter(function(x){return x===true}).length;
    $('#ov-svc').innerHTML=svcUp+' <small>/ '+STATE.services.length+'</small>';
    $('#ov-ctr').innerHTML=ctrUp+' <small>/ '+STATE.containers.length+'</small>';
    $('#ov-cmp').innerHTML=cmpUp+' <small>/ '+STATE.compose.length+'</small>';
    $('#ov-up').innerHTML=upd?upd+' <small>ready</small>':'<span style="color:var(--muted)">none</span>';
    $('#b-ctr').textContent=STATE.containers.length;$('#b-svc').textContent=STATE.services.length;
  }

  // ══════════ CATALOG ══════════
  function renderCatalog(){
    var installed={};STATE.containers.forEach(function(c){if(c.fromCatalog)installed[c.fromCatalog]=c.name});
    $('#catalog-grid').innerHTML=CATALOG.map(function(a){
      var is=installed[a.id];
      return '<div class="card"><div class="card-head"><div class="card-icon ic-app">'+a.icon+'</div>'+
        '<div style="min-width:0"><h4>'+esc(a.name)+'</h4><p class="meta">'+esc(a.cat)+(a.compose?' · Compose':'')+'</p></div></div>'+
        '<p class="desc">'+esc(a.desc)+'</p>'+
        '<div class="badge-row"><span class="pill '+(is?'ok':'idle')+'">'+(is?'Installed':'Available')+'</span></div>'+
        '<div class="card-actions">'+
          (is?'<button class="danger" data-uninstall="'+esc(is)+'"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13"/></svg>Uninstall</button>':'<button data-install="'+esc(a.id)+'"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Install</button>')+
        '</div></div>'}).join('');
    $$('[data-install]').forEach(function(b){b.onclick=function(){installApp(b.getAttribute('data-install'))}});
    $$('[data-uninstall]').forEach(function(b){b.onclick=function(){wipeContainer(b.getAttribute('data-uninstall'))}});
  }
  function installApp(id){
    var a=CATALOG.filter(function(x){return x.id===id})[0];if(!a)return;
    if(a.compose){
      // Compose templates: prefill the compose wizard
      composeWizard({name:a.id,content:composeTemplateFor(a)});return;
    }
    containerWizard({name:a.id,image:a.image,ports:(a.ports||[]).map(function(p){return p}),volumes:a.vols||[],env:a.env||[],labels:[['forgeos.catalog',id]]});
  }
  function composeTemplateFor(a){
    return 'name: '+a.id+'\nservices:\n  app:\n    image: '+a.image+'\n    restart: unless-stopped\n    ports:\n      - "'+(a.ports&&a.ports[0]||'80:80')+'"\n    labels:\n      forgeos.catalog: '+a.id+'\n';
  }

  // ══════════ CONTAINER CREATE WIZARD ══════════
  function containerWizard(prefill){
    prefill=prefill||{};
    var html=
      '<div class="field"><label>Name</label><input id="cw-name" placeholder="my-container" value="'+esc(prefill.name||'')+'"></div>'+
      '<div class="field"><label>Image</label><input id="cw-image" placeholder="nginx:latest" value="'+esc(prefill.image||'')+'"></div>'+
      '<div class="field-row"><div class="field"><label>Restart policy</label><select id="cw-restart"><option value="unless-stopped">unless-stopped</option><option value="always">always</option><option value="on-failure">on-failure</option><option value="no">no</option></select></div>'+
      '<div class="field"><label>Working directory (optional)</label><input id="cw-workdir" placeholder="/app"></div></div>'+
      '<div class="field"><label>Ports (host:container, optional /udp)</label><div id="cw-ports" class="pair-list"></div><button class="add-pair" id="cw-add-port">+ Add port mapping</button></div>'+
      '<div class="field"><label>Volumes (host_path:container_path[:ro])</label><div id="cw-vols" class="pair-list"></div><button class="add-pair" id="cw-add-vol">+ Add volume</button></div>'+
      '<details class="adv"><summary><svg class="ico" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>Advanced settings</summary><div class="body">'+
        '<div class="field"><label>Environment variables</label><div id="cw-env" class="pair-list"></div><button class="add-pair" id="cw-add-env">+ Add variable</button></div>'+
        '<div class="field"><label>Networks (one per row)</label><div id="cw-nets" class="pair-list"></div><button class="add-pair" id="cw-add-net">+ Add network</button></div>'+
        '<div class="field"><label>Labels</label><div id="cw-labels" class="pair-list"></div><button class="add-pair" id="cw-add-label">+ Add label</button></div>'+
        '<div class="field-row"><div class="field"><label>CPU limit (e.g. 1.5)</label><input id="cw-cpu" placeholder="2"></div>'+
        '<div class="field"><label>Memory limit (e.g. 512m, 2g)</label><input id="cw-mem" placeholder="1g"></div></div>'+
        '<div class="field"><label>Command override (space-separated)</label><input id="cw-cmd" placeholder="--config /etc/app.conf"></div>'+
        '<div class="field"><label>Entrypoint override</label><input id="cw-ep" placeholder="/usr/local/bin/start.sh"></div>'+
        '<div class="field"><label>Healthcheck command (optional)</label><input id="cw-hc" placeholder="curl -f http://localhost/health"></div>'+
        '<div class="field-row"><div class="field"><label>Health interval</label><input id="cw-hci" placeholder="30s"></div>'+
        '<div class="field"><label>Health retries</label><input id="cw-hcr" placeholder="3"></div></div>'+
      '</div></details>';
    var m=modal({title:'Create container',sub:'Basic fields up top, advanced settings collapsed below.',size:'big',html:html,cta:'Create',
      onSubmit:async function(back){
        var b={name:$('#cw-name',back).value.trim(),image:$('#cw-image',back).value.trim(),restart:$('#cw-restart',back).value,workdir:$('#cw-workdir',back).value.trim()||undefined,
          ports:plPorts.values().map(function(p){return p[0]+':'+p[1]+(p[2]?'/'+p[2]:'')}).filter(function(s){return s.length>1}),
          volumes:plVols.values().map(function(p){return p[0]+':'+p[1]+(p[2]?':'+p[2]:'')}).filter(function(s){return s.length>1}),

        if(!b.name||!b.image){toast('Name and image required','warn');return false}

    // Wire repeating lists. Ports use 3-field rows for host:container[/proto].
    function portList(el,initial){
      function add(host,ctr,proto){var row=document.createElement('div');row.className='pair-row';row.style.gridTemplateColumns='1fr 1fr 80px auto';
        row.innerHTML='<input placeholder="host port" value="'+esc(host||'')+'"><input placeholder="container port" value="'+esc(ctr||'')+'"><select><option value="">tcp</option><option value="udp" '+(proto==='udp'?'selected':'')+'>udp</option></select><button type="button">×</button>';
        $('button',row).onclick=function(){row.remove()};el.appendChild(row)}
      (initial||[]).forEach(function(s){var m=String(s).match(/^(\d+):(\d+)(?:\/(tcp|udp))?$/);if(m)add(m[1],m[2],m[3])});
      return {add:function(){add('','','')},values:function(){return $$('.pair-row',el).map(function(r){var i=$$('input',r),s=$('select',r);return [i[0].value.trim(),i[1].value.trim(),s.value]}).filter(function(p){return p[0]&&p[1]})}};
    }
    function volList(el,initial){
      function add(h,c,ro){var row=document.createElement('div');row.className='pair-row';row.style.gridTemplateColumns='1.2fr 1.2fr auto auto';
        row.innerHTML='<input placeholder="/host/path" value="'+esc(h||'')+'"><input placeholder="/container/path" value="'+esc(c||'')+'"><label class="checkbox-field" style="padding:0 10px;height:38px"><input type="checkbox" '+(ro?'checked':'')+'>RO</label><button type="button">×</button>';
        $('button[type=button]',row).onclick=function(){row.remove()};el.appendChild(row)}
      (initial||[]).forEach(function(s){var p=String(s).split(':');add(p[0],p[1],p[2]==='ro')});
      return {add:function(){add('','',false)},values:function(){return $$('.pair-row',el).map(function(r){var i=$$('input[placeholder]',r),c=$('input[type=checkbox]',r);return [i[0].value.trim(),i[1].value.trim(),c.checked?'ro':'']}).filter(function(p){return p[0]&&p[1]})}};
    }
    var plPorts=portList($('#cw-ports',m.el),prefill.ports);
    var plVols=volList($('#cw-vols',m.el),prefill.volumes);
    var plEnv=pairList($('#cw-env',m.el),(prefill.env||[]).map(function(e){var i=e.indexOf('=');return [e.slice(0,i),e.slice(i+1)]}),'KEY','value');
    var plNets=singleList($('#cw-nets',m.el),prefill.networks||[],'bridge / my-net');
    var plLabels=pairList($('#cw-labels',m.el),prefill.labels||[],'label','value');
    $('#cw-add-port',m.el).onclick=function(){plPorts.add()};
    $('#cw-add-vol',m.el).onclick=function(){plVols.add()};
    $('#cw-add-env',m.el).onclick=function(){plEnv.add('','')};
    $('#cw-add-net',m.el).onclick=function(){plNets.add('')};
    $('#cw-add-label',m.el).onclick=function(){plLabels.add('','')};
  }

      '<div id="nx-advanced" class="hidden">'+
        '<div class="warn-box">Advanced mode replaces the generated config with whatever you type here. nginx -t still runs before save.</div>'+
        '<div class="field"><label>Raw nginx configuration</label><textarea id="nx-raw" style="min-height:280px">'+esc(initContent||'server {\n  listen 80;\n  server_name example.com;\n  location / {\n    proxy_pass http://127.0.0.1:8080;\n    proxy_set_header Host $host;\n  }\n}\n')+'</textarea></div>'+
      '</div>'+
      '<label class="checkbox-field" style="margin-top:14px"><input type="checkbox" id="nx-enabled" checked>Enable this site immediately</label>';
    var m=modal({title:initContent?'Edit nginx site':'New nginx site',sub:'Pick a complexity level. Each tier builds on the one before it.',size:'big',html:html,cta:'Save',
      onSubmit:async function(back){
        var name=($('#nx-name',back)||{}).value||'';name=name.trim();
        var enabled=$('#nx-enabled',back).checked;
        var content;
        if(tier==='advanced'){content=$('#nx-raw',back).value;name=name||'site-'+Date.now()}
        else{
          var host=$('#nx-host',back).value.trim(),up=$('#nx-upstream',back).value.trim(),ssl=$('#nx-ssl',back).checked;
          if(!name||!host||!up){toast('Name, domain, and upstream required','warn');return false}
          var headers='    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $scheme;\n';
          var extra='';
          if(tier==='standard'){
            var bu=$('#nx-ba-user',back).value.trim();var bp=$('#nx-ba-pass',back).value;
            if(bu&&bp){extra+='    auth_basic "Restricted";\n    auth_basic_user_file /etc/nginx/.htpasswd-'+name+';\n';
              toast('Note: also create the .htpasswd file manually with htpasswd -c','info')}
            if($('#nx-gzip',back).checked){extra+='    gzip on;\n    gzip_types text/plain application/json application/javascript text/css;\n'}
            if($('#nx-clientmax',back).checked){extra='    client_max_body_size 500M;\n'+extra}
            if($('#nx-hsts',back).checked&&ssl){extra+='    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;\n'}
          }
          content='server {\n  listen '+(ssl?'443 ssl':'80')+';\n  server_name '+host+';\n\n  location / {\n    proxy_pass '+up+';\n'+headers+extra+'  }\n}\n';
        }
        var r=await api('/api/nginx/site',{method:'POST',body:JSON.stringify({name:name,content:content,enabled:enabled})});
        toast(r.ok?name+' saved':(r.data&&r.data.detail)||'Save failed',r.ok?'ok':'err');return r.ok}});
    $$('#nx-tier button',m.el).forEach(function(b){b.onclick=function(){
      $$('#nx-tier button',m.el).forEach(function(x){x.classList.remove('active');if(b.classList.contains('advanced'))x.classList.remove('active')});
      b.classList.add('active');tier=b.getAttribute('data-tier');
      ['simple','standard','advanced'].forEach(function(t){$('#nx-'+t,m.el).classList.toggle('hidden',t!==tier)});
    }});
    if(initContent){tier='advanced';$$('#nx-tier button',m.el)[2].click()}
  }
  async function nginxEdit(name){var d=(await api('/api/nginx/site/'+name)).data;if(!d)return;nginxWizard(d.content)}

  // — Forge Object Storage tiered —
  function forgeStoreOpen(){
    var tier='simple';
    var html='<div class="wz-tier" id="fs-tier"><button class="active" data-tier="simple">Simple</button><button data-tier="standard">Standard</button><button data-tier="advanced" class="advanced">Advanced</button></div>'+
      '<div id="fs-simple">'+
        '<div class="field"><label>Data directory (where buckets live)</label><input id="fs-data" placeholder="/srv/nas/main/object-storage" value="/srv/nas/main/object-storage"></div>'+
        '<div class="field"><label>Admin access key</label><input id="fs-ak" placeholder="forgeadmin"></div>'+
        '<div class="field"><label>Admin secret key (16+ chars)</label><input id="fs-sk" type="password" placeholder="••••••••••••••••"></div>'+
      '</div>'+
      '<div id="fs-standard" class="hidden">'+
        '<div class="field-row"><div class="field"><label>S3 API port</label><input id="fs-port" value="9000"></div><div class="field"><label>Console port</label><input id="fs-console" value="9001"></div></div>'+
        '<div class="field"><label>Region (S3 region identifier)</label><input id="fs-region" value="us-east-1"></div>'+
        '<label class="checkbox-field" style="margin-bottom:10px"><input type="checkbox" id="fs-tls">Enable TLS (you must provide certs in /etc/forgeos/object-storage/certs)</label>'+
        '<label class="checkbox-field"><input type="checkbox" id="fs-versioning">Default versioning for new buckets</label>'+
      '</div>'+
      '<div id="fs-advanced" class="hidden">'+
        '<div class="warn-box">Direct config edit. Restart of the service is required after save.</div>'+
        '<div class="field"><label>config.yaml</label><textarea id="fs-raw" style="min-height:280px"># Forge Object Storage configuration\nendpoint: 0.0.0.0:9000\nconsole: 0.0.0.0:9001\ndata: /srv/nas/main/object-storage\nregion: us-east-1\ntls:\n  enabled: false\n</textarea></div>'+
      '</div>';
    var m=modal({title:'Forge Object Storage',sub:'S3-compatible buckets backed by ForgeRAID.',size:'big',html:html,cta:'Save & restart',
      onSubmit:async function(back){
        var body={};
        if(tier==='advanced')body={raw_config:$('#fs-raw',back).value};
        else{
          body={data:$('#fs-data',back).value.trim(),access_key:$('#fs-ak',back).value.trim(),secret_key:$('#fs-sk',back).value};
          if(!body.data||!body.access_key||!body.secret_key){toast('Data dir + admin keys required','warn');return false}
          if(body.secret_key.length<16){toast('Secret key must be 16+ chars','warn');return false}
          if(tier==='standard'){body.api_port=$('#fs-port',back).value||'9000';body.console_port=$('#fs-console',back).value||'9001';body.region=$('#fs-region',back).value||'us-east-1';body.tls=$('#fs-tls',back).checked;body.default_versioning=$('#fs-versioning',back).checked}
        }
        var r=await api('/api/service/forge-object-storage/config',{method:'POST',body:JSON.stringify(body)});
        toast(r.ok?'Saved; restarting…':(r.data&&r.data.detail)||'Failed',r.ok?'ok':'err');return r.ok}});
    $$('#fs-tier button',m.el).forEach(function(b){b.onclick=function(){$$('#fs-tier button',m.el).forEach(function(x){x.classList.remove('active')});b.classList.add('active');tier=b.getAttribute('data-tier');['simple','standard','advanced'].forEach(function(t){$('#fs-'+t,m.el).classList.toggle('hidden',t!==tier)})}});
  }

  // ══════════ TABS + REFRESH ══════════
  function switchTab(t){$$('.tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-t')===t)});['catalog','containers','services'].forEach(function(x){$('#tab-'+x).classList.toggle('hidden',x!==t)})}
  function switchSub(st){$$('.subtab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-st')===st)});$('#sub-ctrs').classList.toggle('hidden',st!=='ctrs');$('#sub-compose').classList.toggle('hidden',st!=='compose')}
  async function refresh(){
    var [svc,docker,lxc,cmp]=await Promise.all([api('/api/services'),api('/api/docker/containers'),api('/api/docker/lxc/containers'),api('/api/compose/projects')]);
    STATE.services=(svc.data&&svc.data.services)||[];
    var docks=((docker.data&&docker.data.containers)||[]).map(function(c){var labels=c.Labels||c.labels||{};return {name:(c.Names&&c.Names.replace(/^\//,''))||c.name,image:c.Image||c.image,running:(c.State||c.state||'').toLowerCase()==='running',status:c.Status||c.state,runtime:'docker',composeProject:labels['com.docker.compose.project'],fromCatalog:labels['forgeos.catalog']}});
    var incs=((lxc.data&&lxc.data.containers)||[]).map(function(c){return {name:c.name,image:c.image||c.type||'container',running:c.status==='Running',status:c.status,runtime:'container'}});
    STATE.containers=docks.concat(incs);
    STATE.compose=(cmp.data&&cmp.data.projects)||[];
    recalc();renderCatalog();renderContainers();renderCompose();renderServices();
  }

  document.addEventListener('DOMContentLoaded',function(){
    $$('.tab').forEach(function(b){b.onclick=function(){switchTab(b.getAttribute('data-t'))}});
    $$('.subtab').forEach(function(b){b.onclick=function(){switchSub(b.getAttribute('data-st'))}});
    $('#refresh').onclick=function(){refresh();toast('Refreshed','info')};
    $('#check-updates').onclick=checkAllUpdates;
    $('#new-ctr').onclick=function(){containerWizard()};
    $('#new-compose').onclick=function(){composeWizard()};
    refresh();
  });
})();
</script>
</body>
