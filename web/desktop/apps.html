<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content='width=device-width, initial-scale=1'>
<title>Apps & Services · ForgeNAS</title>
<script>var _d=document.documentElement,_l=localStorage;_d.dataset.theme=_l.getItem("forgeos_theme")||"dark";_d.dataset.accent=_l.getItem("forgeos_accent")||"ember"</script>
<link rel="stylesheet" href="/css/forgeos.css">
<style>
/* apps-specific */
.toast{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);font-size:13px;font-weight:700;min-width:220px;max-width:420px}
.modal{width:min(560px,95vw);padding:24px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);max-height:92vh;overflow:auto}
.modal.big{width:min(820px,95vw)}
.modal.huge{width:min(1000px,96vw)}
.modal p.sub{margin:0 0 16px;color:var(--muted);font-size:13px}
.modal .field{display:grid;gap:6px;margin-bottom:14px}
.modal label{font-size:12px;font-weight:800;color:var(--muted)}
.modal input,.modal select,.modal textarea{padding:0 14px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);font:600 14px var(--font);color:var(--text);outline:0;width:100%;box-sizing:border-box}
.modal input,.modal select{height:44px}
.modal textarea{padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;min-height:160px;resize:vertical;line-height:1.5}
.btn-pri{height:44px;padding:0 18px;border:0;border-radius:13px;cursor:pointer;font:800 13px var(--font);color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2))}
.warn-box{padding:12px 14px;border-radius:13px;background:rgba(207,61,70,.08);border:1px solid rgba(207,61,70,.25);color:#9a2730;font-size:13px;font-weight:600;margin-bottom:14px}
/* tabs */
    .tabs{display:flex;gap:6px;padding:6px;background:var(--surface-2);border-radius:14px;border:1px solid var(--line);width:fit-content;margin-bottom:18px}
.tab{padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:800;color:#3a495f;transition:.15s;background:transparent;border:0}
.tab.active{background:var(--surface);color:var(--primary);box-shadow:0 2px 8px rgba(41,98,255,.12)}
.tab .badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:900}
/* sub-tabs (in-page) */
    .subtabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.subtab{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border:0;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* unified card grid */
    .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow-soft);transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.card-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none;font-size:22px}
.card-icon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9}
.ic-svc{background:linear-gradient(135deg,var(--primary),var(--primary-2))}
.ic-ctr{background:linear-gradient(135deg,#b06bd8,#7d5ce8)}
.ic-app{background:linear-gradient(135deg,#0bbf78,var(--success))}
.ic-store{background:linear-gradient(135deg,#e8835c,#f4a200)}
.ic-compose{background:linear-gradient(135deg,#3a495f,#5a6c87)}
.card h4{margin:0;font-size:15px;letter-spacing:-.02em}
.card .meta{margin:2px 0 0;color:var(--muted);font-size:12px;font-weight:600;word-break:break-all}
.card .desc{color:var(--muted);font-size:12px;font-weight:600;margin:0 0 12px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.03em}
.pill.ok{background:rgba(16,166,106,.14);color:var(--success)}
.pill.warn{background:rgba(216,138,0,.14);color:var(--warn)}
.pill.err{background:rgba(207,61,70,.14);color:var(--danger)}
.pill.idle{background:var(--surface-3);color:var(--muted)}
.pill.update{background:rgba(216,138,0,.16);color:var(--warn);position:absolute;top:14px;right:14px;cursor:pointer}
.pill.update svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.card-actions button{flex:1;min-width:0;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:800 11px var(--font);color:#3a495f;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:.15s;padding:0 8px}
.card-actions button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.card-actions button.danger:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
.card-actions button:disabled{opacity:.4;cursor:default}
.card-actions button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.ov-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.ov-card{padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-soft)}
.ov-card .lbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ov-card .val{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.ov-card .val small{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.powered{margin-top:24px;padding:12px 16px;background:var(--surface-3);border-radius:12px;font-size:12px;color:var(--muted);font-weight:600;text-align:center}
/* wizard / advanced expander */
    .wz-tier{display:flex;gap:6px;padding:5px;background:var(--surface-2);border-radius:12px;border:1px solid var(--line);margin-bottom:18px}
.wz-tier button{flex:1;padding:9px 14px;border:0;background:transparent;border-radius:8px;font:800 12px var(--font);color:var(--muted);cursor:pointer;transition:.15s}
.wz-tier button.active{background:var(--surface);color:var(--primary);box-shadow:0 2px 6px rgba(41,98,255,.1)}
.wz-tier button.advanced.active{color:var(--warn);background:rgba(216,138,0,.08)}
details.adv{margin:14px 0;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);overflow:hidden}
details.adv > summary{padding:12px 16px;cursor:pointer;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px;list-style:none}
details.adv > summary::-webkit-details-marker{display:none}
details.adv > summary::after{content:'▾';margin-left:auto;color:var(--muted);transition:.15s}
details.adv[open] > summary::after{transform:rotate(180deg)}
details.adv > .body{padding:0 16px 14px}
.pair-list{display:grid;gap:6px;margin-bottom:8px}
.pair-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.pair-row input{height:38px!important;padding:0 12px!important}
.pair-row button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--danger);cursor:pointer;font-weight:900}
.add-pair{height:36px;padding:0 14px;border:1px dashed var(--line);background:transparent;border-radius:10px;font:700 12px var(--font);color:var(--muted);cursor:pointer;width:100%}
.add-pair:hover{border-color:var(--primary);color:var(--primary)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checkbox-field{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);cursor:pointer;font-size:13px;font-weight:600;color:var(--text)}
.checkbox-field input{width:16px;height:16px;accent-color:var(--primary)}
/* compose editor */
    .file-drop{padding:24px;border:2px dashed var(--line);border-radius:13px;background:var(--surface-2);text-align:center;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;margin-bottom:14px;transition:.15s}
.file-drop:hover,.file-drop.over{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.file-drop b{display:block;color:var(--text);margin-bottom:4px;font-weight:800;font-size:14px}
</style>
</head>
<body>

  <div class="app"><main class="main" style="grid-column:1/-1">
    <header class="topbar" style="grid-template-columns:1fr auto">
      <div class="section-head" style="margin:0"><div><h3 style="font-size:22px">Apps &amp; Services</h3><p>System services, containers, compose stacks, and the app catalog</p></div></div>
      <div class="top-actions">
        <button class="circle-btn" id="refresh" title="Refresh"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8M20 4v4h-4M20 12a8 8 0 0 1-13.7 5.7L4 16M4 20v-4h4"/></svg></button>
        <button class="button" id="check-updates" style="background:var(--primary-soft);color:var(--primary)"><svg class="ico" viewBox="0 0 24 24"><path d="M12 2v8M9 7l3 3 3-3M5 16a8 8 0 0 0 14 0"/></svg>Check updates</button>
      </div>
    </header>

    <div class="ov-strip">
      <div class="ov-card"><div class="lbl">Services</div><div class="val" id="ov-svc">—</div></div>
      <div class="ov-card"><div class="lbl">Containers</div><div class="val" id="ov-ctr">—</div></div>
      <div class="ov-card"><div class="lbl">Compose stacks</div><div class="val" id="ov-cmp">—</div></div>
      <div class="ov-card"><div class="lbl">Updates available</div><div class="val" id="ov-up">—</div></div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-t="catalog">Catalog</button>
      <button class="tab" data-t="containers">Containers <span class="badge" id="b-ctr">—</span></button>
      <button class="tab" data-t="services">Services <span class="badge" id="b-svc">—</span></button>
    </div>

    <section id="tab-catalog"><div class="grid-cards" id="catalog-grid"><div class="empty">Loading catalog…</div></div></section>

    <section id="tab-containers" class="hidden">
      <div class="subtabs">
        <button class="subtab active" data-st="ctrs">Containers</button>
        <button class="subtab" data-st="compose">Compose Stacks</button>
        <div style="flex:1"></div>
        <button class="btn-pri" id="new-ctr" style="height:36px;padding:0 14px;font-size:12px;margin-bottom:6px">+ New container</button>
        <button class="btn-ghost" id="new-compose" style="height:36px;padding:0 14px;font-size:12px;margin-bottom:6px;margin-left:6px">+ New compose</button>
      </div>
      <div id="sub-ctrs"><div class="grid-cards" id="containers-grid"><div class="empty">Loading containers…</div></div></div>
      <div id="sub-compose" class="hidden"><div class="grid-cards" id="compose-grid"><div class="empty">Loading stacks…</div></div></div>
    </section>

    <section id="tab-services" class="hidden">
      <div class="grid-cards" id="services-grid"><div class="empty">Loading services…</div></div>
    </section>

    <div class="powered">Object storage powered by RustFS · Container runtimes: Docker &amp; Incus</div>
  </main></div>
  <div id="toasts"></div>
<script src="/js/apps.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
