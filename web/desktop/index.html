<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForgeOS</title>
  <link rel="stylesheet" href="css/forgeos.css">
</head>
<body>
  <!-- SVG Icon Sprite -->
  <object data="icons.svg" type="image/svg+xml" style="display: none;"></object>
  
  <!-- Top Navigation -->
  <forge-topnav></forge-topnav>
  
  <!-- Dashboard Area -->
  <div id="dashboard" class="dashboard glass-subtle" style="margin-top: var(--topnav-height); padding: var(--space-md);">
    <div class="widget-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-md);">
      
      <!-- System Health Widget -->
      <div class="widget-container glass">
        <widget-system></widget-system>
      </div>
      
      <!-- Storage Overview Widget -->
      <div class="widget-container widget-2x1 glass">
        <widget-storage></widget-storage>
      </div>
      
      <!-- Network Status Widget -->
      <div class="widget-container glass">
        <widget-network></widget-network>
      </div>
      
       <!-- Recent Alerts Widget -->
       <div class="widget-container glass">
         <widget-alerts></widget-alerts>
       </div>

       <!-- ForgeFileDB Widget -->
       <div class="widget-container glass">
         <widget-filedb></widget-filedb>
       </div>
     </div>
   </div>

   <!-- Scripts -->
   <script src="components/forge-widget.js"></script>
   <script src="components/widget-system.js"></script>
   <script src="components/widget-storage.js"></script>
   <script src="components/widget-network.js"></script>
   <script src="components/widget-alerts.js"></script>
   <script src="components/widget-filedb.js"></script>
 </body>
</html>
