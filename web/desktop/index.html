<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/forgeos-v2.css">
<style>
/* Override wallpaper */
#app {
  background: url('wallpapers/wp-nebula.svg') center/cover fixed;
}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">F</div>
      <span class="sidebar-title">ForgeOS</span>
    </div>
    
    <nav class="sidebar-nav" id="nav-main">
      <!-- Dynamic navigation built by JS -->
    </nav>
    
    <div class="sidebar-footer" style="padding: 16px; border-top: 1px solid var(--border-light);">
      <button class="btn btn-ghost" style="width: 100%;" onclick="toggleSidebar()">
        <span>☰</span> Collapse
      </button>
    </div>
  </aside>
  
  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <header class="header">
      <h1 class="header-title" id="header-title">Dashboard</h1>
      <div class="header-actions">
        <button class="btn btn-ghost" id="header-refresh" title="Refresh">↻</button>
        <button class="btn btn-ghost" id="header-notifications" title="Notifications">🔔</button>
        <button class="btn btn-ghost" id="header-search" title="Search">⌕</button>
      </div>
    </header>
    
    <!-- Content Panels -->
    <div class="content" id="main-content">
      <!-- Dashboard Panel -->
      <div class="panel active" id="panel-dashboard">
        <div class="widget-grid" id="dashboard-widgets">
          <!-- Dynamic widgets -->
        </div>
      </div>
      
      <!-- Storage Panel -->
      <div class="panel" id="panel-storage">
        <div id="storage-pools"></div>
      </div>
      
      <!-- Docker/Apps Panel -->
      <div class="panel" id="panel-docker">
        <div class="flex justify-between items-center mb-lg">
          <h2>Container Apps</h2>
          <button class="btn btn-primary" onclick="showAppBrowser()">+ Add App</button>
        </div>
        <div class="grid grid-3" id="docker-containers">
          <!-- Dynamic containers -->
        </div>
      </div>
      
      <!-- Network Panel -->
      <div class="panel" id="panel-network">
        <div id="network-interfaces"></div>
      </div>
      
      <!-- Backup Panel -->
      <div class="panel" id="panel-backup">
        <div class="grid grid-4 mb-lg" id="backup-tools">
          <!-- Backup tool cards -->
        </div>
      </div>
      
      <!-- Shares Panel -->
      <div class="panel" id="panel-shares">
        <div class="flex justify-between items-center mb-lg">
          <h2>File Shares</h2>
          <button class="btn btn-primary" onclick="showShareModal()">+ New Share</button>
        </div>
        <div id="shares-list"></div>
      </div>
      
      <!-- Mail Panel -->
      <div class="panel" id="panel-mail">
        <div class="grid grid-2 mb-lg">
          <div class="stat-card">
            <span class="stat-label">Mail Queue</span>
            <span class="stat-value" id="mail-queue">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Status</span>
            <span class="stat-value" id="mail-status">-</span>
          </div>
        </div>
      </div>
      
      <!-- Auth Panel -->
      <div class="panel" id="panel-auth">
        <div class="flex justify-between items-center mb-lg">
          <h2>Users</h2>
          <button class="btn btn-primary" onclick="showUserModal()">+ Add User</button>
        </div>
        <div id="auth-users"></div>
      </div>
      
      <!-- Monitoring Panel -->
      <div class="panel" id="panel-monitoring">
        <div class="widget-grid" id="monitoring-widgets"></div>
      </div>
      
      <!-- Imaging Panel -->
      <div class="panel" id="panel-imaging">
        <div class="grid grid-2 mb-lg">
          <div class="card">
            <h3>FOG Imaging</h3>
            <p class="text-secondary">Network-based system imaging and deployment</p>
            <div class="mt-md">
              <span class="stat-label">Images</span>
              <span class="stat-value" id="fog-images">0</span>
            </div>
            <button class="btn btn-primary mt-md" onclick="openFOG()">Open FOG</button>
          </div>
          <div class="card">
            <h3>Recovery ISO</h3>
            <p class="text-secondary">Download Clonezilla for USB recovery</p>
            <button class="btn btn-secondary mt-md" onclick="downloadClonezilla()">Download</button>
          </div>
        </div>
      </div>
      
      <!-- Settings Panel -->
      <div class="panel" id="panel-settings">
        <div class="settings-sections">
          <div class="card mb-md">
            <h3>System</h3>
            <div class="form-group">
              <label class="form-label">Hostname</label>
              <input class="form-input" id="setting-hostname" type="text">
            </div>
            <div class="form-group">
              <label class="form-label">Timezone</label>
              <select class="form-input" id="setting-timezone">
                <option value="America/Chicago">America/Chicago</option>
                <option value="America/New_York">America/New_York</option>
                <option value="Europe/London">Europe/London</option>
                <option value="Europe/Berlin">Europe/Berlin</option>
              </select>
            </div>
          </div>
          
          <div class="card mb-md">
            <h3>Storage</h3>
            <div class="form-group">
              <label class="form-label">Default Pool</label>
              <select class="form-input" id="setting-default-pool"></select>
            </div>
          </div>
          
          <div class="card mb-md">
            <h3>Security</h3>
            <div class="form-group">
              <label class="form-label">Firewall</label>
              <select class="form-input" id="setting-firewall">
                <option value="enabled">Enabled</option>
                <option value="disabled">Disabled</option>
              </select>
            </div>
          </div>
          
          <div class="card mb-md">
            <h3>Updates</h3>
            <div class="form-group">
              <label class="form-label">Auto Update</label>
              <select class="form-input" id="setting-auto-update">
                <option value="true">Enabled</option>
                <option value="false">Disabled</option>
              </select>
            </div>
          </div>
          
          <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modals -->
<div id="modal-overlay" class="modal-overlay" style="display: none;">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Title</h3>
      <button class="btn btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

<script src="js/forgeos-v2.js"></script>
<script>
// App browser data
const APP_CATALOG = [
  { name: 'Homarr', icon: '⬡', image: 'ghcr.io/ax翰ent/homarr:latest', port: 3000, category: 'dashboard' },
  { name: 'Portainer', icon: '◉', image: 'portainer/portainer-ce:latest', port: 9000, category: 'dashboard' },
  { name: 'Jellyfin', icon: '🎬', image: 'jellyfin/jellyfin:latest', port: 8096, category: 'media' },
  { name: 'Radarr', icon: '🎞', image: 'radarr/radarr:latest', port: 7878, category: 'media' },
  { name: 'Sonarr', icon: '📺', image: 'sonarr/sonarr:latest', port: 8989, category: 'media' },
  { name: 'AdGuard', icon: '🛡', image: 'adguard/adguardhome:latest', port: 3000, category: 'network' },
  { name: 'Nextcloud', icon: '☁', image: 'nextcloud:latest', port: 80, category: 'cloud' },
  { name: 'MinIO', icon: '◫', image: 'minio/minio:latest', port: 9000, category: 'cloud' },
  { name: 'Vaultwarden', icon: '🔐', image: 'vaultwarden/vaultwarden:latest', port: 80, category: 'security' },
  { name: 'Uptime Kuma', icon: '⏱', image: 'louislam/uptime-kuma:latest', port: 3001, category: 'monitoring' },
  { name: 'Grafana', icon: '📊', image: 'grafana/grafana:latest', port: 3000, category: 'monitoring' },
  { name: 'Home Assistant', icon: '🏠', image: 'homeassistant/home-assistant:latest', port: 8123, category: 'automation' }
];

// Show app browser modal
function showAppBrowser() {
  const categories = [...new Set(APP_CATALOG.map(a => a.category))];
  let html = '<div class="grid grid-3">';
  
  APP_CATALOG.forEach(app => {
    html += `
      <div class="card" style="cursor: pointer;" onclick="installApp('${app.image}')">
        <div class="flex items-center gap-sm">
          <span style="font-size: 24px;">${app.icon}</span>
          <div>
            <div class="font-semibold">${app.name}</div>
            <div class="text-sm text-muted">:${app.port}</div>
          </div>
        </div>
      </div>
    `;
  });
  
  html += '</div>';
  
  showModal('Install App', html);
}

// Install app
async function installApp(image) {
  closeModal();
  try {
    await fetch('/api/docker/install', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image })
    });
    loadPanel('docker');
  } catch (error) {
    console.error('Install failed:', error);
  }
}

// Show share modal
function showShareModal() {
  showModal('Create Share', `
    <div class="form-group">
      <label class="form-label">Share Name</label>
      <input class="form-input" id="share-name" type="text">
    </div>
    <div class="form-group">
      <label class="form-label">Path</label>
      <input class="form-input" id="share-path" type="text">
    </div>
    <div class="form-group">
      <label class="form-label">Type</label>
      <select class="form-input" id="share-type">
        <option value="smb">SMB</option>
        <option value="nfs">NFS</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="createShare()">Create</button>
  `);
}

// Create share
async function createShare() {
  const name = document.getElementById('share-name').value;
  const path = document.getElementById('share-path').value;
  const type = document.getElementById('share-type').value;
  
  closeModal();
  try {
    await fetch('/api/shares/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, path, type })
    });
    loadPanel('shares');
  } catch (error) {
    console.error('Create share failed:', error);
  }
}

// Show user modal
function showUserModal() {
  showModal('Add User', `
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-input" id="user-name" type="text">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" id="user-password" type="password">
    </div>
    <div class="form-group">
      <label class="form-label">Role</label>
      <select class="form-input" id="user-role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="createUser()">Create</button>
  `);
}

// Create user
async function createUser() {
  const name = document.getElementById('user-name').value;
  const password = document.getElementById('user-password').value;
  const role = document.getElementById('user-role').value;
  
  closeModal();
  try {
    await fetch('/api/auth/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, password, role })
    });
    loadPanel('auth');
  } catch (error) {
    console.error('Create user failed:', error);
  }
}

// Modal functions
function showModal(title, content) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-content').innerHTML = content;
  document.getElementById('modal-overlay').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

// Settings
async function saveSettings() {
  const settings = {
    hostname: document.getElementById('setting-hostname').value,
    timezone: document.getElementById('setting-timezone').value,
    defaultPool: document.getElementById('setting-default-pool').value,
    firewall: document.getElementById('setting-firewall').value,
    autoUpdate: document.getElementById('setting-auto-update').value
  };
  
  try {
    await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(settings)
    });
    alert('Settings saved!');
  } catch (error) {
    console.error('Save failed:', error);
  }
}

// FOG
function openFOG() {
  window.open('/fog', '_blank');
}

// Clonezilla
function downloadClonezilla() {
  window.open('https://clonezilla.org/downloads.php', '_blank');
}

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});
</script>
</body>
</html>
