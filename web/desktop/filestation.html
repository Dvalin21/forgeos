<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Station - ForgeOS</title>
  <link rel="stylesheet" href="css/forgeos.css">
</head>
<body>
  <forge-topnav></forge-topnav>
  
  <div class="page-content">
    <div class="page-header flex justify-between items-center">
      <h2>File Station</h2>
      <div>
        <button class="btn">Upload</button>
        <button class="btn">New Folder</button>
      </div>
    </div>
    
    <div class="breadcrumb">
      <span><svg viewBox="0 0 24 24" class="svg-icon mr-xs"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Share1</span> > <span>Photos</span> > <span>2026</span>
    </div>
    
    <div class="file-grid">
      <div class="file-item card">
        <div class="file-icon-lg"><svg viewBox="0 0 48 48"><path d="M32 8H12a4 4 0 0 0-4 4v24a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4V20z"/><polyline points="32 8 32 20 44 20"/></svg></div>
        <div>file.txt</div>
      </div>
      <div class="file-item card">
        <div class="file-icon-lg"><svg viewBox="0 0 48 48"><path d="M44 38a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4h10l4 6h18a4 4 0 0 1 4 4z"/></svg></div>
        <div>folder</div>
      </div>
      <div class="file-item card">
        <div class="file-icon-lg"><svg viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="4"/><circle cx="17" cy="17" r="3"/><polyline points="42 30 32 20 10 42"/></svg></div>
        <div>photo.jpg</div>
      </div>
    </div>
  </div>
  
  <script src="components/forge-topnav.js"></script>

</html>
