<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeOS Icon Reference</title>
<style>
  :root {
    --bg: #0a0e17;
    --surface: #0f1923;
    --text: #e0e8f0;
    --text-secondary: #90aabe;
    --accent: #00b4d8;
    --border: #1a3a5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px;
  }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p { color: var(--text-secondary); margin-bottom: 32px; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  .icon-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    transition: border-color 0.2s;
  }
  .icon-card:hover { border-color: var(--accent); }
  .icon-card svg {
    width: 32px;
    height: 32px;
    stroke: var(--text);
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    margin-bottom: 10px;
  }
  .icon-card .name {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-secondary);
    word-break: break-all;
  }
  .icon-card .call {
    font-size: 10px;
    color: var(--accent);
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
  h2 { font-size: 18px; margin-bottom: 16px; color: var(--accent); }
</style>
</head>
<body>
<h1>ForgeOS Icon System</h1>
<p>All icons rendered at 32px via <code style="color:var(--accent)">Icons.render('name')</code>. Stroke: 2, viewBox: 0 0 24 24 (48x48 for Lg variants).</p>

<div id="app"></div>

<script src="/desktop/js/icons.js"></script>
<script>
const categories = {
  'Navigation & Apps': [
    'dashboard', 'storage', 'network', 'filestation', 'filedb',
    'docker', 'lxc', 'firewall', 'fail2ban', 'settings'
  ],
  'File Types': [
    'file', 'folder', 'image', 'archive', 'code'
  ],
  'Actions': [
    'plus', 'close', 'search', 'refresh', 'trash',
    'terminal', 'logs', 'inspect', 'restart', 'upload', 'download'
  ],
  'Status & Alerts': [
    'check', 'warning', 'alert', 'info', 'critical'
  ],
  'Database & Security': [
    'database', 'lock', 'unlock', 'snapshot'
  ],
  'Miscellaneous': [
    'globe', 'backup', 'cpu', 'memory', 'activity'
  ],
  'File Manager (Large 48x48)': [
    'fileLg', 'folderLg', 'imageLg', 'archiveLg'
  ]
};

const app = document.getElementById('app');
Object.entries(categories).forEach(([category, names]) => {
  const section = document.createElement('div');
  section.innerHTML = `<h2>${category}</h2><div class="grid">${
    names.map(name => {
      const svg = Icons.render(name);
      return `<div class="icon-card">${svg}<div class="name">${name}</div><div class="call">Icons.${name}()</div></div>`;
    }).join('')
  }</div><hr>`;
  app.appendChild(section);
});
</script>
</body>
</html>
