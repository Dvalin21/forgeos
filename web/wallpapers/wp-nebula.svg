<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="nebula" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0a0a0f"/>
    <stop offset="50%" style="stop-color:#12121a"/>
    <stop offset="100%" style="stop-color:#0a0a0f"/>
  </linearGradient>
  <radialGradient id="glow" cx="80%" cy="20%" r="60%">
    <stop offset="0%" style="stop-color:#e85d04;stop-opacity:0.15"/>
    <stop offset="50%" style="stop-color:#e85d04;stop-opacity:0.05"/>
    <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e85d04" stroke-width="0.3" opacity="0.08"/>
  </pattern>
  <filter id="blur">
    <feGaussianBlur stdDeviation="2"/>
  </filter>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="url(#nebula)"/>

<!-- Subtle grid -->
<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- Orange glow -->
<rect width="100%" height="100%" fill="url(#glow)"/>

<!-- Stars -->
<g fill="#fff" opacity="0.4">
