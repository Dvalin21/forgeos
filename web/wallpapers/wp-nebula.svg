</g>

<!-- Subtle nebula clouds -->
<g filter="url(#blur)" opacity="0.3">
  <ellipse cx="1600" cy="300" rx="400" ry="200" fill="#e85d04"/>
  <ellipse cx="400" cy="800" rx="300" ry="150" fill="#4a8ab0"/>
</g>
</svg>