  <circle cx="200" cy="350" r="0.6"/>
  <circle cx="450" cy="400" r="0.5"/>
  <circle cx="680" cy="320" r="0.7"/>
  <circle cx="890" cy="380" r="0.6"/>
  <circle cx="1050" cy="350" r="0.8"/>
  <circle cx="1220" cy="420" r="0.5"/>
  <circle cx="1400" cy="380" r="0.7"/>
  <circle cx="1580" cy="340" r="0.6"/>
  <circle cx="1750" cy="400" r="0.5"/>
  <circle cx="150" cy="520" r="0.6"/>
