<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#060a14"/>
      <stop offset="50%"  stop-color="#0a1022"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>
    <filter id="blurXl"><feGaussianBlur stdDeviation="120"/></filter>
    <filter id="blurLg"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blurMd"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blurSm"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Deep atmospheric glow -->
  <g filter="url(#blurXl)">
    <ellipse cx="960" cy="540" rx="600" ry="420" fill="#003a5c" opacity="0.06"/>
  </g>
  <!-- Horizon layers - fluid overlapping forms -->
  <g filter="url(#blurLg)">
    <path d="M0,1080 C0,700 400,500 960,450 C1520,400 1920,550 1920,1080 Z" fill="#004a68" opacity="0.06"/>
    <path d="M0,1080 C200,800 600,650 1000,600 C1400,550 1700,650 1920,800 L1920,1080 Z" fill="#003050" opacity="0.05"/>
    <ellipse cx="700" cy="450" rx="350" ry="180" fill="#006a90" opacity="0.04"/>
  </g>
  <!-- Horizon line glow -->
  <g filter="url(#blurMd)">
    <path d="M0,480 C400,430 800,420 1200,440 C1600,460 1800,500 1920,520"
          fill="none" stroke="#00a0c8" stroke-width="20" stroke-linecap="round" opacity="0.04"/>
    <ellipse cx="960" cy="460" rx="250" ry="80" fill="#0080a8" opacity="0.04"/>
  </g>
  <!-- Bright accent -->
  <g filter="url(#blurSm)">
    <ellipse cx="880" cy="440" rx="60" ry="30" fill="#00c0e0" opacity="0.04"/>
  </g>
</svg>
