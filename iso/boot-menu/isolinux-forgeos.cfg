# iso/boot-menu/isolinux-forgeos.cfg
#
# DRAFT — not yet verified against a real ISO. This sandbox has no network
# access to debian.org, so the exact current file this needs to be spliced
# into (txt.cfg, gtk.cfg, or menu.cfg depending on trixie's current
# isolinux layout) and its exact existing structure could not be confirmed.
# The TECHNIQUE — a new boot label with a kernel append line carrying
# priority=critical + a preseed/file pointing at the payload we baked onto
# the ISO's own filesystem — is standard isolinux/d-i practice. Splice this
# stanza into the real menu file once you unpack the actual ISO in I4, and
# tell me what the real file looks like so I can fix anything that doesn't
# match.
#
# Assumes the ISO's own filesystem carries this preseed at
# /forgeos/preseed.cfg (i.e. xorriso adds iso/preseed.cfg into the ISO
# image at that path — see build-iso.sh, I4). Using a path ON the ISO
# rather than a network preseed/url keeps the install working with no
# internet beyond what apt itself needs for base packages.

label install-forgeos
    menu label ^Install ForgeOS
    menu default
    kernel /install.amd/vmlinuz
    append vga=788 initrd=/install.amd/initrd.gz auto=true priority=critical \
        preseed/file=/cdrom/forgeos/preseed.cfg \
        hostname=forgeos domain=unassigned-domain \
        --- quiet

# The stock "Advanced options" submenu (expert install / rescue mode /
# automated install) is expected to already exist in the unmodified ISO and
# is deliberately NOT touched here — per the Keith-approved design, it's
# the manual/unpreseeded escape hatch, and it stays that way for free as
# long as nothing here forces priority=critical or a preseed/file onto it.
# CONFIRM this holds on the real ISO before relying on it.
