# iso/boot-menu/grub-forgeos.cfg
#
# DRAFT — same caveat as isolinux-forgeos.cfg: not verified against a real
# ISO's actual grub.cfg (UEFI boot path). Splice this menuentry in once you
# unpack the real ISO in I4.

menuentry "Install ForgeOS" {
    set background_color=black
    linux    /install.amd/vmlinuz vga=788 auto=true priority=critical \
        preseed/file=/cdrom/forgeos/preseed.cfg \
        hostname=forgeos domain=unassigned-domain \
        --- quiet
    initrd   /install.amd/initrd.gz
}

# As with the isolinux entry: the stock "Advanced options" submenu is left
# alone, and should still offer a fully manual/unpreseeded Debian install
# as long as this new entry is additive rather than replacing the default
# menu structure. CONFIRM on the real ISO.
