### ForgeOS preseed.cfg — Debian 13 (trixie) netinst
#
# Automates the whole install except ONE question: which disk to install
# onto (see the PARTITIONING section). Everything else — locale, network,
# mirror, base packages, bootloader — is preseeded so it never prompts.
#
# SCOPE NOTE: this file gets Debian itself onto disk and hands off. It does
# NOT install ForgeOS's own dependencies (samba, nginx, docker, etc) — those
# are installed by install/v2/forgeos_install.py's own base_packages phase,
# which runs from the baked-in payload via late_command/first-boot (I3).
# Duplicating that package list here would just be a second place for it to
# drift out of sync.
#
# VERIFICATION NOTE (read before building): the partial-preseed technique
# below (priority=critical globally, partman-auto/disk deliberately left
# UNSET) is a well-established, long-stable Debian convention, confirmed
# against Debian's own preseed documentation and real-world reports of
# installs "getting stuck" at partman exactly when partman-auto/disk is
# left unset — which is the behavior this file relies on. What could NOT be
# verified here: the EXACT current debconf template names for Debian 13
# specifically, since debian.org isn't reachable from this sandbox. Diff
# this against the real example preseed shipped in the trixie netinst ISO
# (installer/doc/example-preseed.txt on the ISO itself, or
# https://www.debian.org/releases/trixie/example-preseed.txt) on first
# build, and fix any renamed keys — the STRUCTURE and TECHNIQUE are sound;
# a handful of key spellings are the one real unknown.


### Localization — no prompts
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us


### Network configuration — no prompts
# DHCP during install (this box needs internet anyway to fetch base
# packages — the "baked-in payload" decision was about the ForgeOS
# application code, not the OS-level apt packages it depends on).
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string forgeos
d-i netcfg/get_domain string unassigned-domain
d-i netcfg/wireless_wep string
# Never let a flaky DHCP handshake at install time silently fall through to
# manual network configuration prompts.
d-i netcfg/dhcp_timeout string 60


### Mirror — no prompts
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string


### Account setup — no prompts, but read this before building
#
# DECISION (my default, not yet Keith-confirmed — flagged, not buried):
#   - root password login DISABLED entirely.
#   - one local account "forgeos" is created for OS-level / sudo access,
#     with its password LOCKED at the shadow-file level (crypted value "*"
#     — the standard convention meaning "this account exists but password
#     auth is impossible"). It is NOT a login you can use out of the box.
#   - SSH is hardened in late_command (PasswordAuthentication no,
#     PermitRootLogin no) as belt-and-suspenders on top of the locked
#     account.
#   - Reasoning: all real administration happens through the ForgeOS web
#     UI. Baking a Linux password into a distributed ISO/preseed — even a
#     random one — means anyone with the ISO can read it. A locked account
#     removes that vector entirely. Until you provision an SSH key (drop
#     one into the payload, or add it post-install), OS-level shell access
#     is via the Proxmox/physical console — exactly how this VM has been
#     accessed throughout development.
#   - If you'd rather have a real (even temporary) OS password for initial
#     SSH access, tell me and I'll change this — it's a one-line swap to
#     passwd/user-password-crypted with a real hash instead of "*".
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string ForgeOS
d-i passwd/username string forgeos
d-i passwd/user-password-crypted password *
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false


### Clock and time zone — no prompts
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true


### PARTITIONING — the one interactive step
#
# d-i partman-auto/disk is DELIBERATELY LEFT UNSET. With priority=critical
# set globally (via the boot append line — see iso/boot-menu/), any
# question that HAS a preseeded answer is skipped silently; any question
# that does NOT is only shown if its own priority is critical. Debian
# treats "which disk" as exactly that — a data-destructive choice it will
# not silently default even under full automation — so leaving it unset is
# what makes d-i stop and show the interactive disk list. This is the
# entire mechanism the "interactive disk pick only" design relies on.
#
# Everything about HOW that chosen disk gets partitioned is preseeded:
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
# One straightforward partition layout (no LVM, no encryption) — this is
# the OS disk only; data pools are configured later from the storage page,
# not here.
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# Belt-and-suspenders: never let an unrelated already-mounted swap/crypt
# volume on another disk cause a surprise extra prompt.
d-i partman-md/confirm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/device_remove_lvm boolean true


### Base system install — no prompts
d-i base-installer/kernel/image string linux-image-amd64


### Apt setup — no prompts
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org


### Package selection — minimal, no desktop, no phone-home
# ForgeOS's own dependencies (samba/nginx/docker/etc) are installed later
# by forgeos_install.py, not here — see the SCOPE NOTE at the top.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false
d-i pkgsel/update-policy select none


### Boot loader — no prompts
# Installs to the SAME disk the operator picked in the one interactive
# step above (partman handed the target back to grub-installer).
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default


### Late command — STUBBED for I1
#
# The real payload-copy + first-boot systemd unit wiring is I3's job, not
# this file's. Left as a proof-of-life marker so I1 (this file) is
# independently inspectable/testable before I3 exists: a real build should
# show this marker on the installed disk, confirming late_command actually
# ran.
d-i preseed/late_command string \
    in-target sh -c 'echo "forgeos-preseed: late_command ran at $(date -u +%FT%TZ)" > /etc/forgeos-preseed-marker'


### Finish — no prompts
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
d-i debian-installer/exit/poweroff boolean false
