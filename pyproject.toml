[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeos-api"
version = "1.0.0"
description = "ForgeOS NAS web API backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.25",
    "python-jose>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",
    "psutil>=5.9",
    "pydantic>=2.5",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "daemon: marks tests that require the ForgeFileDB daemon",
]
