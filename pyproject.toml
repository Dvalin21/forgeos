[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeos-api"
version = "1.0.0"
description = "ForgeOS NAS web API backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.25",
    "python-jose>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.x's bundled bcrypt handler is incompatible with bcrypt
    # 4.1+ (the __about__.__version__ attribute was removed AND the hashpw
    # config-string API changed, so every hash/verify raises ValueError).
    # Pin below 4.1 until passlib ships a release that supports modern
    # bcrypt. Without this, a fresh install pulls bcrypt 5.x and the entire
    # auth system breaks — nobody can log in. (Found via dual-env testing.)
    "bcrypt<4.1",
    "httpx>=0.27",
    "psutil>=5.9",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.6",
    "pyotp>=2.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "boto3>=1.34",
]
# RustFS / S3-compatible object storage support. Optional: the rustfs
# API router degrades gracefully (logs a warning, skips its routes) if
# boto3 is absent. Install with: pip install -e '.[rustfs]'
rustfs = [
    "boto3>=1.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "daemon: marks tests that require the ForgeFileDB daemon",
]

[tool.setuptools]
# src/ holds the package modules. Discover the `generators` package + ship
# its Jinja2 templates as package data (without this, an INSTALLED package
# raises TemplateNotFound). Flat top-level modules are listed explicitly in
# py-modules below rather than left to auto-discovery, which was
# inconsistent (it silently dropped the CLI wrapper modules).
package-dir = {"" = "src"}
include-package-data = true
py-modules = [
    "forgeos_config",
    "forgeos_smtp",
    "forgeos_health",
    "forgeos_ports",
    "forgeos_appstore",
    "forgeos_appinstall",
    "forgeos_appstore_exec",
    "forgeos_toggles",
    "forgeos_osbackup",
    "forgeos_osbackup_cli",
    "forgeos_imaging",
    "forgeos_imaging_cli",
    "forgeos_diskprep",
    "forgeos_storage_cli",
    "forgeos_generate_cli",
    "forgeos_app_cli",
    "forgeos_auth",
    "audit_api",
    "auth_api",
    "backup_api",
    "docker_api",
    "docker_lxc_api",
    "lxc_api",
    "data_connect_api",
    "forgeos_pages_api",
    "imaging_api",
    "nginx_api",
    "notifications_api",
    "rustfs_api",
    "samba_api",
    "security_api",
    "storage_api",
    "system_api",
    "users_api",
    "vpn_api",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["generators*"]

[tool.setuptools.package-data]
generators = ["templates/*.j2"]

[project.scripts]
forgeos-generate = "forgeos_generate_cli:main"
forgeos-app = "forgeos_app_cli:main"
forgeos-osbackup = "forgeos_osbackup_cli:main"
forgeos-storage = "forgeos_storage_cli:main"
forgeos-imaging = "forgeos_imaging_cli:main"
