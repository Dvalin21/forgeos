[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeos-api"
version = "1.0.0"
description = "ForgeOS NAS web API backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.25",
    "python-jose>=3.3",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "psutil>=5.9",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.6",
    "pyotp>=2.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "boto3>=1.34",
]
# RustFS / S3-compatible object storage support. Optional: the rustfs
# API router degrades gracefully (logs a warning, skips its routes) if
# boto3 is absent. Install with: pip install -e '.[rustfs]'
rustfs = [
    "boto3>=1.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "daemon: marks tests that require the ForgeFileDB daemon",
]

[tool.setuptools]
# src/ holds the package modules. Discover the `generators` package + ship
# its Jinja2 templates as package data (without this, an INSTALLED package
# raises TemplateNotFound). Flat top-level modules are listed explicitly in
# py-modules below rather than left to auto-discovery, which was
# inconsistent (it silently dropped the CLI wrapper modules).
package-dir = {"" = "src"}
include-package-data = true
py-modules = [
    "audit_api",
    "auth_api",
    "backup_api",
    "data_connect_api",
    "db_provision",
    "ddns",
    "docker_lxc_api",
    "firewall_api",
    "forgeos_app_cli",
    "forgeos_appinstall",
    "forgeos_appstore",
    "forgeos_appstore_exec",
    "forgeos_atomic",
    "forgeos_auth",
    "forgeos_config",
    "forgeos_diskprep",
    "forgeos_firstboot",
    "forgeos_generate_cli",
    "forgeos_health",
    "forgeos_imaging",
    "forgeos_imaging_cli",
    "forgeos_lhsr",
    "forgeos_lhsr_exec",
    "forgeos_lhsr_health",
    "forgeos_lhsr_scheduler",
    "forgeos_lhsr_trend",
    "forgeos_osbackup",
    "forgeos_osbackup_cli",
    "forgeos_pages_api",
    "forgeos_ports",
    "forgeos_smtp",
    "forgeos_storage_cli",
    "forgeos_toggles",
    "lhsr_api",
    "lxc_api",
    "net_networkd",
    "net_rollback",
    "network_api",
    "nginx_api",
    "notifications_api",
    "rustfs_api",
    "samba_api",
    "security_api",
    "setup_api",
    "storage_api",
    "system_api",
    "users_api",
    "vpn_api",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["generators*"]

[tool.setuptools.package-data]
generators = ["templates/*.j2"]

[project.scripts]
forgeos-generate = "forgeos_generate_cli:main"
forgeos-app = "forgeos_app_cli:main"
forgeos-osbackup = "forgeos_osbackup_cli:main"
forgeos-storage = "forgeos_storage_cli:main"
forgeos-imaging = "forgeos_imaging_cli:main"
