[flake8]
max-line-length = 120
extend-ignore =
    # E501: line too long (handled by max-line-length above)
    E501,
    # W503: line break before binary operator (old style)
    W503,
    # E221: multiple spaces before operator (intentional alignment)
    E221,
    # E272: multiple spaces before keyword (intentional alignment)
    E272,
    # E131: continuation line unaligned (cosmetic)
    E131
per-file-ignores =
    src/*.py:E302
